<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دیدگاه اخلاق">

<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Registration + install prompt. Add to public/js/core.js. -->
<script type="module">
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}

const isStandalone = window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone === true;

let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone) document.querySelector('.install-bar')?.removeAttribute('hidden');
});

document.querySelector('.install-bar__btn')?.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.querySelector('.install-bar')?.setAttribute('hidden', '');
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.querySelector('.install-bar')?.setAttribute('hidden', '');
});

if (isStandalone) document.documentElement.dataset.standalone = 'true';
</script>
