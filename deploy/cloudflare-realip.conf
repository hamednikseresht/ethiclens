# /etc/nginx/cloudflare-realip.conf
#
# بازیابی نشانی واقعی بازدیدکننده از پشت کلادفلر.
#
# چرا این فایل حیاتی است:
# وقتی کلادفلر جلوی سایت است، nginx به‌جای نشانی کاربر، نشانی سرور لبه
# کلادفلر را می‌بیند. بدون این تنظیم، همه بازدیدکنندگان از دید برنامه یک
# نشانی مشترک دارند — و محدودکننده‌های نرخ در server/routes/auth.js که بر
# پایه req.ip کار می‌کنند، همه کاربران را با هم می‌شمارند. یعنی بیست ورود
# ناموفق از هر جای دنیا، ورود را برای همه قفل می‌کند.
#
# این فهرست تغییر می‌کند. با deploy/update-cloudflare-ips.sh تازه‌اش کنید
# (اسکریپت همین فایل را بازنویسی می‌کند و nginx را reload می‌کند).
#
# آخرین به‌روزرسانی دستی: ۱۴۰۴/۰۶/۱۰ — منبع رسمی:
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6

# ---- IPv4 ----
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# ---- IPv6 ----
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# کلادفلر نشانی اصلی بازدیدکننده را در این سربرگ می‌گذارد.
# چون فقط از بازه‌های بالا پذیرفته می‌شود، جعل‌پذیر نیست: درخواستی که
# مستقیم به سرور بیاید (نه از راه کلادفلر) این سربرگش نادیده گرفته می‌شود.
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;
