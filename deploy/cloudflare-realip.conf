# /etc/nginx/cloudflare-realip.conf
#
# Recover the visitor's real address from behind Cloudflare.
#
# Why this file matters:
# With Cloudflare in front, nginx sees the address of a Cloudflare edge server
# rather than the visitor's. Without this, every visitor shares one address as
# far as the app is concerned — and the rate limiters in server/routes/auth.js,
# which key on req.ip, count all users together. Twenty failed sign-ins from
# anywhere in the world would lock sign-in for everyone.
#
# The list changes. Refresh it with deploy/update-cloudflare-ips.sh, which
# rewrites this file and reloads nginx.
#
# Last manual update: 2025-09-01 - official sources:
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6

# ---- IPv4 ----
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# ---- IPv6 ----
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare puts the visitor's original address in this header. Because it
# is only trusted from the ranges above it cannot be spoofed: a request that
# reaches the server directly, not through Cloudflare, has it ignored.
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;
