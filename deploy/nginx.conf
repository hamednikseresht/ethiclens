# /etc/nginx/sites-available/ethiclens
# After editing:  ln -s /etc/nginx/sites-available/ethiclens /etc/nginx/sites-enabled/
#                 nginx -t && systemctl reload nginx
#
# This configuration assumes the site sits behind Cloudflare:
#   visitor -> Cloudflare (public TLS) -> this server (Origin cert) -> the app
#
# Two things cause real trouble when overlooked:
#
#   1. The visitor's real address. Without cloudflare-realip.conf every
#      visitor looks like one address to the app, and the sign-in rate
#      limiter locks all of them out together.
#
#   2. Buffering. An analysis is streamed as SSE. nginx buffering has to be
#      off for the analyze routes, or the user sees nothing until it ends.

# Cloudflare's ranges and CF-Connecting-IP, refreshed by
# deploy/update-cloudflare-ips.sh. Without this line nginx still starts, but
# every address the app sees is wrong.
include /etc/nginx/cloudflare-realip.conf;

upstream ethiclens_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Shared upstream headers.
#
# X-Forwarded-For is deliberately set to $remote_addr rather than
# $proxy_add_x_forwarded_for. Once real_ip has been applied, $remote_addr is
# the visitor's real address as vouched for by Cloudflare. Appending to the
# chain instead would let anyone who reaches this server directly present a
# forged header, feed the app any address they liked, and walk past the rate
# limiter.
# ---------------------------------------------------------------------------
map $http_x_forwarded_proto $fwd_proto {
    default https;   # Cloudflare always forwards https
    http    http;
}

server {
    listen 80;
    listen [::]:80;
    server_name ethiclens.ir www.ethiclens.ir;

    # The Origin certificate makes ACME unnecessary, but this path is needed
    # if a certificate is ever issued directly, without Cloudflare.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# Refuse direct access.
#
# If someone finds the server's IP and calls it directly, this block hangs up
# on them. The real protection is the firewall (Cloudflare ranges only); this
# is the second layer, and it stops requests carrying an unknown Host.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/ethiclens.ir.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ethiclens.ir.key;

    return 444;
}

server {
    # HTTP/2 is declared the old way, on the listen line, rather than with the
    # separate "http2 on" directive. That directive arrived in nginx 1.25.1;
    # Ubuntu 22.04 (nginx 1.18) and 24.04 (nginx 1.24) do not know it and
    # refuse to start with: unknown directive "http2". This form has worked
    # everywhere since 1.9.5.
    #
    # Behind Cloudflare the setting is close to moot anyway: Cloudflare speaks
    # HTTP/2 to the browser but HTTP/1.1 to the origin by default.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ethiclens.ir www.ethiclens.ir;

    # ---- Cloudflare Origin certificate ----
    # Issued by Cloudflare (SSL/TLS -> Origin Server -> Create Certificate).
    # Only Cloudflare considers it valid, which is enough, because only
    # Cloudflare talks to this server directly. It lasts 15 years, so unlike
    # Let's Encrypt it needs no renewal job.
    ssl_certificate     /etc/ssl/cloudflare/ethiclens.ir.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ethiclens.ir.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Authenticated Origin Pulls (optional, recommended) ----
    # Cloudflare presents its own client certificate on connect and nginx
    # verifies it. With this on, knowing the server's address is not enough to
    # reach it without Cloudflare's certificate. Fetch the CA from Cloudflare's
    # documentation, put it at the path below, then uncomment the two lines:
    #
    #   sudo curl -fsSL -o /etc/ssl/cloudflare/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    #
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    # Cloudflare can send HSTS too. If it is enabled there, drop this line so
    # the header is not sent twice.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # ---- Analyze routes: unbuffered, with a long timeout ----
    #
    # Matches all three:
    #   /api/analyze/stream      browser stream
    #   /api/v1/analyze/stream   API stream
    #   /api/v1/analyze          synchronous API response
    #
    # An analysis averages around 100 seconds and can reach 340, so nginx's
    # default 60-second timeout would cut it off partway through.
    #
    # On Cloudflare: the origin response timeout on the free plan is about 100
    # seconds (error 524). That is not a problem here, because the app sends a
    # ": ping" heartbeat every 15 seconds on the stream
    # (server/routes/analyze.js) and the connection is never quiet that long.
    # The app also sends no-transform and X-Accel-Buffering itself, so
    # Cloudflare neither buffers nor compresses the response.
    location ~ ^/api/(v1/)?analyze {
        proxy_pass http://ethiclens_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Connection        '';

        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # The connection test and the bulk model test in the admin panel can also
    # run long, because both depend on an external service.
    location /api/admin/ {
        proxy_pass http://ethiclens_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_read_timeout 300s;
    }

    # ---- Application build assets ----
    #
    # Every filename carries a content hash, so one URL never comes to mean
    # something else and can be held for a year. nginx reads them straight off
    # disk so these requests never reach Node.
    #
    # If the app is installed elsewhere, try_files falls back to @app and
    # everything still works through Express — so a wrong path does not break
    # the site. The default comes from deploy/update.sh (APP_DIR=/opt/ethiclens).
    #
    # The three security headers are repeated because add_header in a child
    # block discards every add_header from the parent — including the ones
    # marked always.
    location /assets/ {
        alias /opt/ethiclens/client-dist/assets/;
        try_files $uri @app;

        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location @app {
        proxy_pass http://ethiclens_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Static files for the server-rendered pages. Fonts and icons are
    # deliberately not here: Express sends a week for those, and this block's
    # expires would demote it to an hour.
    location ~* ^/(css|js)/ {
        proxy_pass http://ethiclens_app;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---- Everything else ----
    location / {
        proxy_pass http://ethiclens_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/ethiclens.access.log;
    error_log  /var/log/nginx/ethiclens.error.log;
}
