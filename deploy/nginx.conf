# /etc/nginx/sites-available/ethica
# پس از ویرایش:  ln -s /etc/nginx/sites-available/ethica /etc/nginx/sites-enabled/
#                nginx -t && systemctl reload nginx
#
# نکته مهم: پاسخ تحلیل به‌صورت SSE استریم می‌شود. بافر nginx باید برای
# مسیر /api/analyze/ خاموش باشد، وگرنه کاربر تا پایان کار چیزی نمی‌بیند.

upstream ethica_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# تغییر مسیر HTTP به HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # گواهی Let's Encrypt (با certbot ساخته می‌شود)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # ---- مسیر استریم تحلیل: بدون بافر و با مهلت طولانی ----
    location /api/analyze/ {
        proxy_pass http://ethica_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # ---- بقیه برنامه ----
    location / {
        proxy_pass http://ethica_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 120s;
    }

    # فایل‌های ایستا با کش طولانی‌تر
    location ~* ^/(css|js)/ {
        proxy_pass http://ethica_app;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/ethica.access.log;
    error_log  /var/log/nginx/ethica.error.log;
}
