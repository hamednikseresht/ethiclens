# /etc/nginx/sites-available/ethiclens
# پس از ویرایش:  ln -s /etc/nginx/sites-available/ethiclens /etc/nginx/sites-enabled/
#                nginx -t && systemctl reload nginx
#
# این پیکربندی برای قرارگرفتن پشت کلادفلر نوشته شده است:
#   کاربر → کلادفلر (TLS عمومی) → این سرور (TLS با گواهی Origin) → برنامه
#
# دو نکته که نادیده‌گرفتنشان دردسر می‌سازد:
#
#   ۱. نشانی واقعی کاربر — بدون cloudflare-realip.conf همه بازدیدکنندگان
#      از دید برنامه یک نشانی دارند و محدودکننده نرخ ورود، همه را با هم
#      قفل می‌کند.
#
#   ۲. بافر — پاسخ تحلیل به‌صورت SSE استریم می‌شود. بافر nginx باید برای
#      مسیر analyze خاموش باشد، وگرنه کاربر تا پایان کار چیزی نمی‌بیند.

# بازه‌های کلادفلر و CF-Connecting-IP. با deploy/update-cloudflare-ips.sh
# تازه می‌شود. اگر این خط نباشد، nginx بالا می‌آید ولی نشانی‌ها غلط‌اند.
include /etc/nginx/cloudflare-realip.conf;

upstream ethiclens_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# سربرگ‌های مشترکِ رو به بالادست.
#
# X-Forwarded-For را عمداً روی $remote_addr می‌گذاریم، نه
# $proxy_add_x_forwarded_for. پس از اعمال real_ip، مقدار $remote_addr همان
# نشانی واقعی کاربر است که کلادفلر تأیید کرده. اگر به‌جایش زنجیره را
# پیش می‌بردیم، هر کسی که مستقیم به نشانی سرور بزند می‌توانست با یک سربرگ
# ساختگی، نشانی دلخواهش را به برنامه بقبولاند و محدودکننده نرخ را دور بزند.
# ---------------------------------------------------------------------------
map $http_x_forwarded_proto $fwd_proto {
    default https;   # کلادفلر همیشه https می‌فرستد
    http    http;
}

server {
    listen 80;
    listen [::]:80;
    server_name ethiclens.ir www.ethiclens.ir;

    # با گواهی Origin نیازی به ACME نیست، ولی اگر روزی مستقیم
    # (بدون کلادفلر) گواهی گرفتید این مسیر لازم می‌شود.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# بستن دسترسی مستقیم.
#
# اگر کسی نشانی IP سرور را پیدا کند و مستقیم صدا بزند، این بلوک جوابش را
# می‌بندد. حفاظت واقعی از راه فایروال است (فقط بازه‌های کلادفلر)، ولی این
# لایه دوم جلوی درخواست‌هایی با Host ناشناس را می‌گیرد.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/ethiclens.ir.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ethiclens.ir.key;

    return 444;
}

server {
    # HTTP/2 به شکل قدیمی روی خط listen نوشته شده، نه با دستور جدای
    # «http2 on». آن دستور از nginx 1.25.1 به بعد آمده و اوبونتو ۲۲.۰۴
    # (nginx 1.18) و ۲۴.۰۴ (nginx 1.24) آن را نمی‌شناسند و با خطای
    # unknown directive "http2" بالا نمی‌آیند. این شکل از 1.9.5 به بعد
    # همه‌جا کار می‌کند.
    #
    # ضمناً پشت کلادفلر این گزینه عملاً بی‌اثر است: کلادفلر HTTP/2 را با
    # مرورگر کاربر صحبت می‌کند ولی با مبدأ به‌صورت پیش‌فرض HTTP/1.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ethiclens.ir www.ethiclens.ir;

    # ---- گواهی Origin کلادفلر ----
    # این گواهی را کلادفلر می‌سازد (SSL/TLS → Origin Server → Create
    # Certificate). فقط کلادفلر آن را معتبر می‌داند و همین کافی است، چون
    # تنها کلادفلر مستقیم با این سرور حرف می‌زند. اعتبارش ۱۵ سال است، پس
    # برخلاف Let's Encrypt نیازی به تمدید خودکار ندارد.
    ssl_certificate     /etc/ssl/cloudflare/ethiclens.ir.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ethiclens.ir.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Authenticated Origin Pulls (اختیاری ولی توصیه‌شده) ----
    # کلادفلر هنگام اتصال، گواهی سمت خودش را نشان می‌دهد و nginx بررسی‌اش
    # می‌کند. با این کار حتی اگر کسی نشانی سرور را بداند، بدون گواهی
    # کلادفلر نمی‌تواند وارد شود. گواهی CA را از مستندات کلادفلر بگیرید و
    # در مسیر زیر بگذارید، سپس این دو خط را از حالت توضیح دربیاورید:
    #
    #   sudo curl -fsSL -o /etc/ssl/cloudflare/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    #
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    # HSTS را کلادفلر هم می‌تواند بفرستد. اگر آنجا روشنش کردید، این خط را
    # بردارید تا سربرگ تکراری نشود.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # ---- مسیرهای تحلیل: بدون بافر و با مهلت طولانی ----
    #
    # هر سه مسیر را می‌گیرد:
    #   /api/analyze/stream      استریم مرورگر
    #   /api/v1/analyze/stream   استریم API
    #   /api/v1/analyze          پاسخ همگام API
    #
    # تحلیل‌ها به‌طور میانگین حدود ۱۰۰ ثانیه و گاهی تا ۳۴۰ ثانیه طول می‌کشند،
    # پس مهلت پیش‌فرض ۶۰ ثانیه‌ای nginx وسط کار قطعشان می‌کند.
    #
    # درباره کلادفلر: مهلت پاسخ‌گویی مبدأ در پلن رایگان حدود ۱۰۰ ثانیه است
    # (خطای 524). اینجا مشکلی پیش نمی‌آید چون برنامه هر ۱۵ ثانیه یک ضربان
    # «: ping» روی استریم می‌فرستد (server/routes/analyze.js) و اتصال هیچ‌گاه
    # آن‌قدر ساکت نمی‌ماند. همچنین سربرگ‌های no-transform و X-Accel-Buffering
    # را خود برنامه می‌فرستد تا کلادفلر پاسخ را بافر یا فشرده نکند.
    location ~ ^/api/(v1/)?analyze {
        proxy_pass http://ethiclens_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Connection        '';

        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # آزمایش اتصال و آزمایش دسته‌جمعی مدل‌ها در پنل مدیریت هم
    # می‌توانند طولانی شوند، چون به سرویس بیرونی وابسته‌اند.
    location /api/admin/ {
        proxy_pass http://ethiclens_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_read_timeout 300s;
    }

    # ---- دارایی‌های بیلد اپلیکیشن ----
    #
    # نام هر فایل هش محتوا دارد، پس یک نشانی هرگز معنای دیگری پیدا نمی‌کند و
    # می‌شود یک سال نگهش داشت. nginx مستقیم از دیسک می‌خواند تا این درخواست‌ها
    # اصلاً به Node نرسند.
    #
    # اگر برنامه جای دیگری نصب شده باشد، try_files به @app برمی‌گردد و همه‌چیز
    # مثل قبل از راه Express کار می‌کند — یعنی مسیر اشتباه سایت را نمی‌شکند.
    # مسیر پیش‌فرض از deploy/update.sh می‌آید (APP_DIR=/opt/ethiclens).
    #
    # سه سربرگ امنیتی تکرار شده‌اند چون add_header در بلوک فرزند، همه‌ی
    # add_header های بلوک پدر را کنار می‌گذارد — حتی آن‌هایی که always دارند.
    location /assets/ {
        alias /opt/ethiclens/client-dist/assets/;
        try_files $uri @app;

        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location @app {
        proxy_pass http://ethiclens_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # فایل‌های ایستای صفحه‌های سرور-رندر. فونت و آیکون عمداً اینجا نیستند:
    # Express برایشان یک هفته می‌فرستد و expires این بلوک آن را به یک ساعت
    # تنزل می‌داد.
    location ~* ^/(css|js)/ {
        proxy_pass http://ethiclens_app;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---- بقیه برنامه ----
    location / {
        proxy_pass http://ethiclens_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/ethiclens.access.log;
    error_log  /var/log/nginx/ethiclens.error.log;
}
