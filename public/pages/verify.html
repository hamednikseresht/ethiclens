<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>تأیید ایمیل — دیدگاه اخلاق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/motion.css">
<style>
  body{display:flex;flex-direction:column;min-height:100vh}
  .page-center{flex:1;display:grid;place-items:center;padding:1.5rem 1rem;
       background:radial-gradient(1000px 500px at 50% -15%, var(--primary-soft), transparent 62%), var(--bg-body)}
  .vbox{width:min(460px,100%);text-align:center}
  .vbrand{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:1.6rem}
  .vbrand .brand-mark{width:38px;height:38px;font-size:1.1rem;border-radius:11px}
  .vbrand span:last-child{font-size:1.3rem;font-weight:900}
  .vicon{font-size:3rem;line-height:1;margin-bottom:.9rem}
  .vbox h1{font-size:1.25rem;font-weight:900;margin-bottom:.6rem;line-height:1.6}
  .vbox p{font-size:.92rem;color:var(--text-muted);line-height:2;margin-bottom:1.4rem}
  .vactions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
</style>
<script src="/js/analytics.js"></script>
</head>
<body>
<header class="topbar" id="topbar"></header>

<div class="page-center"><div class="vbox">
  <div class="vbrand"><span class="brand-mark">ا</span><span>Ethic Lens</span></div>
  <div class="card"><div class="card-body" id="host">
    <div class="vicon"><span class="spinner spinner-lg"></span></div>
    <h1>در حال بررسی پیوند…</h1>
    <p>لحظه‌ای صبر کنید.</p>
  </div></div>
</div>
<script type="module">
import { $, api, state, loadSession, renderTopbar, esc } from '/js/core.js';

const token = new URLSearchParams(location.search).get('token');
const host = $('#host');

function show({ icon, title, text, actions = '' }) {
  host.innerHTML = `
    <div class="vicon">${icon}</div>
    <h1>${title}</h1>
    <p>${text}</p>
    <div class="vactions">${actions}</div>`;
}

if (!token) {
  try { await loadSession(); } catch {}
  renderTopbar();
  show({
    icon: '🔗',
    title: 'پیوند تأیید ناقص است',
    text: 'نشانی را کامل از ایمیل کپی کنید، یا از حسابتان پیوند تازه بخواهید.',
    actions: '<a class="btn btn-primary" href="/login">ورود به حساب</a>'
  });
} else {
  try {
    // This request needs a CSRF token; fetch the session first
    await loadSession();
    renderTopbar();
    const r = await api.post('/api/auth/verify', { token });

    show({
      icon: '✅',
      title: 'ایمیل شما تأیید شد',
      text: r.signedIn
        ? 'حسابتان فعال است و وارد شده‌اید. حالا می‌توانید اولین دوراهی‌تان را تحلیل کنید.'
        : 'حسابتان فعال شد. برای ادامه وارد شوید.',
      actions: r.signedIn
        ? `<a class="btn btn-primary btn-lg" href="/app">🧭 شروع تحلیل</a>
           <a class="btn btn-lg" href="/dashboard">داشبورد</a>`
        : '<a class="btn btn-primary btn-lg" href="/login">ورود به حساب</a>'
    });
  } catch (e) {
    const expired = e.data?.reason === 'expired' || e.data?.reason === 'used';
    show({
      icon: expired ? '⏳' : '⚠️',
      title: expired ? 'این پیوند دیگر معتبر نیست' : 'پیوند تأیید معتبر نیست',
      text: esc(e.message),
      actions: `<a class="btn btn-primary" href="/login">ورود و درخواست پیوند تازه</a>`
    });
  }
}
</script>
</body>
</html>
