<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>تاریخچه — دیدگاه اخلاق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/motion.css">
<style>
  .toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.1rem}
  .toolbar .input{max-width:340px}
  .items{display:grid;grid-template-columns:1fr;gap:.75rem}
  @media (min-width:900px){.items{grid-template-columns:1fr 1fr}}
  .item{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-sm);
        padding:1.05rem 1.15rem;transition:all .18s;display:flex;flex-direction:column;gap:.5rem}
  .item:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
  .item-title{font-size:.95rem;font-weight:800;line-height:1.6;color:var(--text);text-decoration:none}
  .item-title:hover{color:var(--primary);text-decoration:none}
  .item-excerpt{font-size:.83rem;color:var(--text-muted);line-height:1.75;
                display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item-foot{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.75rem;color:var(--text-faint);
             border-top:1px solid var(--border);padding-top:.6rem;margin-top:auto}
  .pager{display:flex;justify-content:center;align-items:center;gap:.4rem;margin-top:1.5rem;flex-wrap:wrap}
  .star{background:none;border:none;cursor:pointer;font-size:1rem;padding:.15rem;line-height:1;filter:grayscale(1);opacity:.45}
  .star.on{filter:none;opacity:1}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="row-between" style="margin-bottom:1.1rem">
    <div>
      <h1 style="font-size:1.3rem;font-weight:900">تاریخچه تحلیل‌ها</h1>
      <p style="font-size:.86rem;color:var(--text-muted)" id="countLine">—</p>
    </div>
    <a href="/app" class="btn btn-primary btn-sm">＋ تحلیل تازه</a>
  </div>

  <div class="toolbar">
    <input class="input" id="q" type="search" placeholder="جست‌وجو در عنوان و متن دوراهی…">
    <label class="switch"><input type="checkbox" id="favOnly"> فقط نشان‌شده‌ها</label>
    <label class="switch"><input type="checkbox" id="needsReflect"> منتظر بازنگری</label>
    <span class="grow"></span>
  </div>

  <div id="listHost" class="items"></div>
  <div class="pager" id="pager"></div>
</main>

<script type="module">
import { $, api, boot, esc, faNum, relTime, duration, toast, confirmDialog, modal } from '/js/core.js';
import { initMotion, revealOnScroll } from '/js/motion.js';

if (!await boot()) throw new Error('unauthenticated');

let page = 1, q = '', fav = false, needsReflect = false;

async function load() {
  const host = $('#listHost');
  host.innerHTML = Array.from({ length: 4 }, () =>
    '<div class="item"><div class="skeleton" style="height:1.2rem;width:70%"></div><div class="skeleton" style="height:2.4rem"></div></div>').join('');

  const params = new URLSearchParams({ page, perPage: 12 });
  if (q) params.set('q', q);
  if (fav) params.set('favorite', '1');
  if (needsReflect) params.set('reflected', '0');

  const data = await api.get('/api/history?' + params);
  $('#countLine').textContent = data.total
    ? `${faNum(data.total)} تحلیل ثبت شده` : 'هنوز چیزی ثبت نشده';

  if (!data.items.length) {
    host.style.gridTemplateColumns = '1fr';
    host.innerHTML = `
      <div class="card"><div class="empty">
        <div class="empty-icon">🔍</div>
        <h3>${q || fav || needsReflect ? 'چیزی پیدا نشد' : 'تاریخچه خالی است'}</h3>
        <p>${q || fav || needsReflect ? 'فیلترها را تغییر دهید یا جست‌وجو را پاک کنید.' : 'اولین دوراهی اخلاقی‌تان را تحلیل کنید تا اینجا ذخیره شود.'}</p>
        <a class="btn btn-primary" href="/app">شروع تحلیل</a>
      </div></div>`;
    $('#pager').innerHTML = '';
    return;
  }
  host.style.gridTemplateColumns = '';

  host.innerHTML = data.items.map(it => `
    <article class="item" data-id="${it.id}">
      <a class="item-title" href="/analysis?id=${it.id}">${esc(it.title)}</a>
      <p class="item-excerpt">${esc(it.excerpt)}</p>
      <div class="item-foot">
        <button class="star ${it.is_favorite ? 'on' : ''}" data-act="fav" title="نشان کردن">⭐</button>
        <span>${relTime(it.created_at)}</span>
        <span>•</span>
        <span>${duration(it.duration_ms)}</span>
        ${it.status === 'error' ? '<span class="badge badge-danger">ناموفق</span>' : ''}
        ${it.status === 'pending' ? '<span class="badge badge-warn">ناتمام</span>' : ''}
        ${it.reflected_at
          ? `<span class="badge badge-reflect" title="${esc(it.decision || '')}">📔 بازنگری شد</span>`
          : it.status === 'done' ? '<span class="badge">منتظر بازنگری</span>' : ''}
        <span class="grow"></span>
        <button class="btn btn-sm btn-ghost" data-act="rename">تغییر نام</button>
        <a class="btn btn-sm btn-ghost" href="/api/history/${it.id}/export">دانلود</a>
        <button class="btn btn-sm btn-ghost" data-act="del" style="color:var(--danger)">حذف</button>
      </div>
    </article>`).join('');

  host.classList.add('stagger');
  revealOnScroll('.item', host);
  $('#pager').innerHTML = data.pages > 1 ? renderPager(data.page, data.pages) : '';
}

function renderPager(cur, pages) {
  const btn = (p, label = p, on = false, dis = false) =>
    `<button class="btn btn-sm ${on ? 'btn-primary' : ''}" data-page="${p}" ${dis ? 'disabled' : ''}>${label === p ? faNum(p) : label}</button>`;
  const parts = [btn(cur - 1, 'قبلی', false, cur === 1)];
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - cur) <= 1) parts.push(btn(p, p, p === cur));
    else if (Math.abs(p - cur) === 2) parts.push('<span style="color:var(--text-faint)">…</span>');
  }
  parts.push(btn(cur + 1, 'بعدی', false, cur === pages));
  return parts.join('');
}

/* ---------- رویدادها ---------- */
$('#pager').onclick = e => {
  const b = e.target.closest('button[data-page]');
  if (!b || b.disabled) return;
  page = +b.dataset.page;
  load();
  scrollTo({ top: 0, behavior: 'smooth' });
};

let searchTimer;
$('#q').oninput = e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { q = e.target.value.trim(); page = 1; load(); }, 320);
};
$('#favOnly').onchange = e => { fav = e.target.checked; page = 1; load(); };
$('#needsReflect').onchange = e => { needsReflect = e.target.checked; page = 1; load(); };

$('#listHost').onclick = async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.item');
  const id = card.dataset.id;
  const act = btn.dataset.act;

  if (act === 'fav') {
    try {
      const r = await api.post(`/api/history/${id}/favorite`);
      btn.classList.toggle('on', r.isFavorite);
    } catch (err) { toast(err.message, 'err'); }
  }

  if (act === 'del') {
    if (!await confirmDialog('حذف تحلیل', 'این تحلیل برای همیشه حذف می‌شود. مطمئنید؟', 'حذف کن')) return;
    try {
      await api.del(`/api/history/${id}`);
      toast('حذف شد.', 'ok');
      load();
    } catch (err) { toast(err.message, 'err'); }
  }

  if (act === 'rename') {
    const current = card.querySelector('.item-title').textContent;
    modal({
      title: 'تغییر نام تحلیل',
      body: `<div class="field"><label for="nt">عنوان تازه</label>
             <input class="input" id="nt" maxlength="120" value="${esc(current)}"></div>`,
      actions: [
        { label: 'ذخیره', className: 'btn-primary', onClick: async (root) => {
            const title = root.querySelector('#nt').value.trim();
            if (!title) { toast('عنوان نمی‌تواند خالی باشد.', 'err'); return 'keep'; }
            try { await api.post(`/api/history/${id}/title`, { title }); load(); toast('ذخیره شد.', 'ok'); }
            catch (err) { toast(err.message, 'err'); return 'keep'; }
          } },
        { label: 'انصراف' }
      ],
      onOpen: root => root.querySelector('#nt').focus()
    });
  }
};

load();
initMotion({ reveal: null });
</script>
</body>
</html>
