<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>تنظیمات حساب — دیدگاه اخلاق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/motion.css">
<script src="/js/analytics.js"></script>
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="wrap-narrow">
  <h1 style="font-size:1.3rem;font-weight:900;margin-bottom:1.2rem">تنظیمات حساب</h1>

  <div class="card" style="margin-bottom:1.1rem">
    <div class="card-head"><h2>مشخصات</h2></div>
    <div class="card-body">
      <form id="profileForm">
        <div class="field">
          <label for="pf-name">نام</label>
          <input class="input" id="pf-name" minlength="2" required>
        </div>
        <div class="field">
          <label>ایمیل</label>
          <input class="input mono" id="pf-email" disabled>
          <span class="hint">ایمیل قابل تغییر نیست. برای تغییر با مدیر سامانه تماس بگیرید.</span>
        </div>
        <button class="btn btn-primary" type="submit">ذخیره مشخصات</button>
      </form>
    </div>
  </div>

  <div class="card" style="margin-bottom:1.1rem">
    <div class="card-head"><h2>تغییر رمز عبور</h2></div>
    <div class="card-body">
      <form id="passForm">
        <div class="field">
          <label for="pw-cur">رمز فعلی</label>
          <input class="input" id="pw-cur" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="pw-new">رمز جدید</label>
          <input class="input" id="pw-new" type="password" autocomplete="new-password" minlength="8" required>
          <span class="hint">حداقل ۸ نویسه.</span>
        </div>
        <div class="field">
          <label for="pw-rep">تکرار رمز جدید</label>
          <input class="input" id="pw-rep" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn btn-primary" type="submit">تغییر رمز</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>ظاهر و اطلاعات</h2></div>
    <div class="card-body">
      <div class="row-between" style="margin-bottom:1rem">
        <div>
          <strong style="font-size:.9rem">حالت نمایش</strong>
          <p class="hint">انتخاب شما در همین مرورگر ذخیره می‌شود.</p>
        </div>
        <button class="btn" id="themeToggle">◐ تغییر تم</button>
      </div>
      <div class="table-wrap">
        <table>
          <tbody>
            <tr><td style="color:var(--text-muted)">نقش</td><td id="i-role">—</td></tr>
            <tr><td style="color:var(--text-muted)">تاریخ عضویت</td><td id="i-created">—</td></tr>
            <tr><td style="color:var(--text-muted)">سهمیه روزانه</td><td id="i-quota">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { $, api, boot, state, toast, faDate, faNum, toggleTheme } from '/js/core.js';
import { initMotion, countUpAll, animateBars } from '/js/motion.js';

if (!await boot()) throw new Error('unauthenticated');

const u = state.user;
$('#pf-name').value = u.name;
$('#pf-email').value = u.email;
$('#i-role').innerHTML = u.role === 'admin'
  ? '<span class="badge badge-primary">مدیر سامانه</span>'
  : '<span class="badge">کاربر</span>';
$('#i-created').textContent = faDate(u.createdAt);

api.get('/api/analyze/quota')
  .then(q => { $('#i-quota').textContent = `${faNum(q.used)} از ${faNum(q.limit)} تحلیل امروز`; })
  .catch(() => {});

$('#themeToggle').onclick = () => toggleTheme();

$('#profileForm').onsubmit = async e => {
  e.preventDefault();
  try {
    await api.post('/api/auth/profile', { name: $('#pf-name').value.trim() });
    toast('مشخصات ذخیره شد.', 'ok');
    setTimeout(() => location.reload(), 700);
  } catch (err) { toast(err.message, 'err'); }
};

$('#passForm').onsubmit = async e => {
  e.preventDefault();
  if ($('#pw-new').value !== $('#pw-rep').value) return toast('رمز جدید و تکرارش یکسان نیستند.', 'err');
  try {
    await api.post('/api/auth/change-password', {
      current: $('#pw-cur').value,
      next: $('#pw-new').value
    });
    toast('رمز عبور تغییر کرد.', 'ok');
    e.target.reset();
  } catch (err) { toast(err.message, 'err'); }
};

initMotion();
</script>
</body>
</html>
