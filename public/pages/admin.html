<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>پنل مدیریت — اتیکا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/motion.css">
<style>
  .admin-layout{display:grid;grid-template-columns:1fr;gap:1.25rem;align-items:start}
  @media (min-width:960px){
    .admin-layout{grid-template-columns:210px 1fr}
    .side{position:sticky;top:calc(var(--nav-h) + 1.5rem)}
  }
  .side{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.4rem;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  @media (min-width:960px){.side{flex-direction:column;overflow:visible}}
  .side button{
    display:flex;align-items:center;gap:.55rem;padding:.6rem .85rem;border-radius:10px;
    border:1px solid transparent;background:none;font-family:inherit;font-size:.88rem;font-weight:700;
    color:var(--text-muted);cursor:pointer;white-space:nowrap;text-align:start;width:100%;
  }
  .side button:hover{background:var(--bg-subtle);color:var(--text)}
  .side button.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
  .panel{display:none}
  .panel.active{display:block}
  .sec-h{font-size:1.15rem;font-weight:900;margin-bottom:.25rem}
  .sec-p{font-size:.85rem;color:var(--text-muted);margin-bottom:1.1rem;line-height:1.75}
  .code-area{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;line-height:1.75;
             direction:rtl;min-height:420px;white-space:pre-wrap}
  .var-chip{display:inline-block;background:var(--bg-inset);border-radius:6px;padding:.05rem .4rem;
            font-family:ui-monospace,monospace;font-size:.78rem;direction:ltr;margin-inline-end:.3rem}
  .split{display:grid;grid-template-columns:1fr;gap:1rem}
  @media (min-width:1100px){.split{grid-template-columns:260px 1fr}}
  .plist{display:flex;flex-direction:column;gap:.35rem;max-height:480px;overflow:auto}
  .plist button{text-align:start;padding:.6rem .8rem;border-radius:9px;border:1px solid var(--border);
                background:var(--bg-surface);font-family:inherit;font-size:.85rem;cursor:pointer;color:var(--text)}
  .plist button.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}
  .plist small{display:block;color:var(--text-muted);font-size:.72rem;font-weight:400}

  /* --- ارائه‌دهندگان --- */
  .prov-list{display:flex;flex-direction:column;gap:.75rem}
  .prov{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
        padding:1rem 1.15rem;box-shadow:var(--shadow-sm)}
  .prov-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.75rem}
  .prov-dot{width:9px;height:9px;border-radius:50%;background:var(--border-strong);flex-shrink:0}
  .prov-dot[data-on="1"]{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
  .prov-name{font-size:.98rem;font-weight:800}
  .prov-url{font-size:.74rem;color:var(--text-muted)}
  .prov-actions{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
                padding-top:.7rem;border-top:1px solid var(--border)}
  .prov-strip{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.1rem}
  .gate-pill{display:flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:700;
             padding:.3rem .65rem;border-radius:999px;border:1px solid var(--border);
             background:var(--bg-subtle);color:var(--text-muted)}
  .gate-pill[data-state="yes"]{background:var(--success-soft);color:var(--success);border-color:transparent}
  .gate-pill[data-state="maybe"]{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .gate-pill[data-state="no"]{background:var(--danger-soft);color:var(--danger);border-color:transparent}

  /* --- انتخاب مدل از فهرست حساب --- */
  .pick-list{max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:.4rem}
  .pick{display:flex;align-items:center;gap:.55rem;padding:.35rem .5rem;border-radius:6px;
        font-size:.78rem;cursor:pointer}
  .pick:hover{background:var(--bg-subtle)}
  .pick input{accent-color:var(--primary);flex-shrink:0}
  .pick .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="row-between" style="margin-bottom:1.2rem">
    <div>
      <h1 style="font-size:1.35rem;font-weight:900">پنل مدیریت</h1>
      <p style="font-size:.86rem;color:var(--text-muted)">تنظیم مدل، دستور تحلیل، کاربران و گزارش‌ها</p>
    </div>
    <span class="badge badge-primary" id="healthBadge">در حال بررسی…</span>
  </div>

  <div class="admin-layout">
    <nav class="side" id="sideNav">
      <button data-tab="overview" class="active">📊 نمای کلی</button>
      <button data-tab="ai">🤖 ارائه‌دهنده و مدل</button>
      <button data-tab="prompts">📝 دستور تحلیل</button>
      <button data-tab="users">👥 کاربران</button>
      <button data-tab="tiers">🎟️ گروه‌ها</button>
      <button data-tab="analyses">🗂️ تحلیل‌ها</button>
      <button data-tab="site">⚙️ تنظیمات سایت</button>
      <button data-tab="audit">🔒 گزارش رخدادها</button>
    </nav>

    <div>
      <section class="panel active" id="p-overview"></section>
      <section class="panel" id="p-ai"></section>
      <section class="panel" id="p-prompts"></section>
      <section class="panel" id="p-users"></section>
      <section class="panel" id="p-tiers"></section>
      <section class="panel" id="p-analyses"></section>
      <section class="panel" id="p-site"></section>
      <section class="panel" id="p-audit"></section>
    </div>
  </div>
</main>

<script type="module">
import { $, $$, api, boot, esc, faNum, faDate, relTime, duration, toast, confirmDialog, modal } from '/js/core.js';
import { initMotion, countUpAll, animateBars, revealOnScroll } from '/js/motion.js';

if (!await boot({ admin: true })) throw new Error('forbidden');

/* ---------------- ناوبری تب‌ها ---------------- */
const loaders = {};
let loaded = new Set();

function show(tab) {
  $$('#sideNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $$('.panel').forEach(p => p.classList.toggle('active', p.id === `p-${tab}`));
  location.hash = tab;
  if (!loaded.has(tab)) { loaded.add(tab); loaders[tab]?.(); }
}
$('#sideNav').onclick = e => {
  const b = e.target.closest('button[data-tab]');
  if (b) show(b.dataset.tab);
};

/* ---------------- نمای کلی ---------------- */
loaders.overview = async () => {
  const host = $('#p-overview');
  host.innerHTML = '<div class="skeleton" style="height:8rem"></div>';
  const d = await api.get('/api/admin/overview');

  const byDay = Object.fromEntries((d.daily || []).map(x => [x.d, x.c]));
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    const k = dt.toISOString().slice(0, 10);
    days.push({ k, c: byDay[k] || 0 });
  }
  const max = Math.max(1, ...days.map(x => x.c));

  host.innerHTML = `
    <h2 class="sec-h">نمای کلی سامانه</h2>
    <p class="sec-p">وضعیت لحظه‌ای کاربران، تحلیل‌ها و مصرف مدل.</p>

    ${d.activeModels === 0
      ? '<div class="alert alert-danger">هیچ مدل فعالی وجود ندارد — تا وقتی در بخش «ارائه‌دهنده و مدل» کلید و مدل تنظیم نکنید، هیچ تحلیلی انجام نمی‌شود.</div>'
      : !d.defaultOk
        ? '<div class="alert alert-warn">مدل پیش‌فرض معتبر نیست. در بخش «ارائه‌دهنده و مدل» یکی را انتخاب و ذخیره کنید.</div>'
        : ''}

    <div class="prov-strip">
      ${d.providers.map(p => `
        <span class="gate-pill" data-state="${p.enabled && p.hasKey && p.models ? 'yes' : p.hasKey ? 'maybe' : 'no'}">
          ${esc(p.label)} — ${p.hasKey ? `${faNum(p.models)} مدل فعال` : 'بدون کلید'}
        </span>`).join('')}
    </div>

    <div class="stat-grid" style="margin-bottom:1.25rem">
      <div class="stat"><div class="stat-label">👥 کاربران</div>
        <div class="stat-value" data-count="${d.users.total}">${faNum(d.users.total)}</div>
        <div class="stat-sub">${faNum(d.users.newWeek || 0)} کاربر تازه این هفته</div></div>
      <div class="stat"><div class="stat-label">🗂️ کل تحلیل‌ها</div>
        <div class="stat-value" data-count="${d.analyses.total}">${faNum(d.analyses.total)}</div>
        <div class="stat-sub">${faNum(d.analyses.today || 0)} مورد امروز</div></div>
      <div class="stat"><div class="stat-label">⚠️ ناموفق</div>
        <div class="stat-value" data-count="${d.analyses.failed || 0}">${faNum(d.analyses.failed || 0)}</div>
        <div class="stat-sub">از ${faNum(d.analyses.total)} درخواست</div></div>
      <div class="stat"><div class="stat-label">🔢 توکن مصرفی</div>
        <div class="stat-value" style="font-size:1.3rem">${faNum(((d.analyses.tokensIn + d.analyses.tokensOut) / 1000).toFixed(1))}K</div>
        <div class="stat-sub">ورودی + خروجی</div></div>
    </div>

    <div class="card" style="margin-bottom:1.1rem">
      <div class="card-head"><h3>📈 تحلیل‌ها در ۳۰ روز اخیر</h3>
        <span class="badge">میانگین زمان: ${faNum((d.analyses.avgMs / 1000).toFixed(1))} ثانیه</span></div>
      <div class="card-body">
        <div class="bars">${days.map(x =>
          `<div class="bar" data-v="${x.c}" style="height:${Math.max(4, (x.c / max) * 100)}%" title="${x.k}: ${x.c}"></div>`).join('')}</div>
      </div>
    </div>

    <div class="split" style="grid-template-columns:1fr">
      <div class="card">
        <div class="card-head"><h3>🤖 مصرف به تفکیک مدل</h3></div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table><thead><tr><th>مدل</th><th>تعداد</th><th>میانگین زمان</th></tr></thead>
          <tbody>${d.byModel.length ? d.byModel.map(m => `
            <tr><td class="mono" style="font-size:.8rem">${esc(m.model)}</td>
                <td>${faNum(m.c)}</td><td>${faNum((m.avgMs / 1000).toFixed(1))} ث</td></tr>`).join('')
            : '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">داده‌ای نیست</td></tr>'}</tbody></table>
        </div>
      </div>

      <div class="card" style="margin-top:1.1rem">
        <div class="card-head"><h3>🏆 فعال‌ترین کاربران</h3></div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table><thead><tr><th>کاربر</th><th>ایمیل</th><th>تحلیل</th></tr></thead>
          <tbody>${d.topUsers.map(u => `
            <tr><td>${esc(u.name)}</td>
                <td class="mono" style="font-size:.78rem">${esc(u.email)}</td>
                <td>${faNum(u.c)}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
    </div>`;

  countUpAll(host);
  animateBars(host.querySelector('.bars'));
  host.querySelector('.stat-grid')?.classList.add('stagger');
  revealOnScroll('.stat', host);
};

/* ---------------- مدل و کلید ---------------- */
loaders.ai = async () => {
  const host = $('#p-ai');
  host.innerHTML = '<div class="skeleton" style="height:8rem"></div>';
  const [prov, models, settings] = await Promise.all([
    api.get('/api/admin/providers'),
    api.get('/api/admin/models'),
    api.get('/api/admin/settings')
  ]);

  const providerCard = p => `
    <article class="prov" data-id="${p.id}" data-key="${esc(p.key)}">
      <header class="prov-head">
        <span class="prov-dot" data-on="${p.enabled ? 1 : 0}"></span>
        <div class="grow">
          <div class="prov-name">${esc(p.label)}</div>
          <div class="prov-url mono">${esc(p.base_url)}</div>
        </div>
        <span class="badge ${p.api_key ? 'badge-success' : 'badge-danger'}">
          ${p.api_key ? 'کلید ثبت شده' : 'بدون کلید'}
        </span>
        <span class="badge">${faNum(p.modelsEnabled)} از ${faNum(p.models)} مدل فعال</span>
      </header>
      <div class="prov-actions">
        <button class="btn btn-sm" data-act="edit">ویرایش</button>
        <button class="btn btn-sm" data-act="test">🔌 آزمایش اتصال</button>
        <button class="btn btn-sm" data-act="browse">📚 مدل‌های حساب</button>
        <label class="switch" style="margin-inline-start:auto">
          <input type="checkbox" data-act="toggle" ${p.enabled ? 'checked' : ''}> فعال
        </label>
        <button class="btn btn-sm btn-ghost" data-act="del" style="color:var(--danger)">حذف</button>
      </div>
      <div class="prov-out"></div>
    </article>`;

  host.innerHTML = `
    <h2 class="sec-h">ارائه‌دهندگان و مدل‌ها</h2>
    <p class="sec-p">
      اتیکا با هر سرویسی که API سازگار با OpenAI داشته باشد کار می‌کند — انویدیا، اوپن‌ای‌آی،
      OpenRouter، Groq و مانند اینها. برای هر ارائه‌دهنده آدرس پایه و کلید جداگانه ثبت می‌شود.
      کلیدها فقط روی سرور می‌مانند و هرگز به مرورگر کاربران فرستاده نمی‌شوند.
    </p>

    <div class="row-between" style="margin-bottom:.8rem">
      <h3 style="font-size:1rem;font-weight:800">ارائه‌دهندگان</h3>
      <button class="btn btn-sm btn-primary" id="addProvider">＋ افزودن ارائه‌دهنده</button>
    </div>
    <div class="prov-list" id="provList">${prov.items.map(providerCard).join('')}</div>

    <div class="card" style="margin:1.4rem 0 1.1rem">
      <div class="card-head"><h3>🎛️ پارامترهای تولید</h3></div>
      <div class="card-body">
        <div class="grid-2">
          <div class="field">
            <label for="dm">مدل پیش‌فرض</label>
            <select class="select" id="dm">
              ${settings.modelOptions.map(o =>
                `<option value="${esc(o.ref)}" ${o.ref === settings.default_model ? 'selected' : ''}>${esc(o.label)}</option>`
              ).join('') || '<option value="">مدل فعالی نیست</option>'}
            </select>
            <span class="hint">
              ${settings.defaultModelValid ? 'مدلی که وقتی کاربر انتخابی نکرده استفاده می‌شود.'
                : '<span style="color:var(--danger)">مدل پیش‌فرض فعلی معتبر نیست — یکی را انتخاب و ذخیره کنید.</span>'}
            </span>
          </div>
          <div class="field">
            <label for="mt">حداکثر توکن پاسخ</label>
            <input class="input" id="mt" type="number" min="1024" max="32768" step="256" value="${esc(settings.max_tokens)}">
            <span class="hint">تحلیل کامل حدود ۴۰۰۰ توکن می‌گیرد؛ کمتر از ۶۰۰۰ خروجی بریده می‌شود.</span>
          </div>
          <div class="field">
            <label for="tp">دما (temperature)</label>
            <input class="input" id="tp" type="number" min="0" max="2" step="0.05" value="${esc(settings.temperature)}">
            <span class="hint">پایین‌تر = محافظه‌کارتر و یکنواخت‌تر. پیشنهاد: ۰٫۵ تا ۰٫۷</span>
          </div>
          <div class="field">
            <label for="pp">top_p</label>
            <input class="input" id="pp" type="number" min="0" max="1" step="0.01" value="${esc(settings.top_p)}">
          </div>
        </div>
        <button class="btn btn-primary" id="saveGen">ذخیره پارامترها</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>📚 مدل‌های در دسترس کاربران</h3>
        <div class="row" style="gap:.4rem">
          <button class="btn btn-sm" id="probeModels">🧪 آزمایش همه مدل‌ها</button>
          <button class="btn btn-sm btn-primary" id="addModel">＋ افزودن مدل</button>
        </div>
      </div>
      <div id="probeOut"></div>
      <div class="table-wrap" style="border:none;border-radius:0">
        <table>
          <thead><tr><th>عنوان</th><th>ارائه‌دهنده</th><th>شناسه</th><th>وضعیت</th><th>دسترسی</th><th></th></tr></thead>
          <tbody id="modelRows">
            ${models.map(m => `
              <tr data-id="${m.id}">
                <td><strong>${esc(m.label)}</strong>${m.note ? `<br><small style="color:var(--text-muted)">${esc(m.note)}</small>` : ''}</td>
                <td><span class="badge">${esc(m.provider_label)}</span></td>
                <td class="mono" style="font-size:.75rem">${esc(m.model_id)}</td>
                <td><label class="switch"><input type="checkbox" data-act="toggle" ${m.enabled ? 'checked' : ''}> ${m.enabled ? 'فعال' : 'خاموش'}</label></td>
                <td><select class="select" data-act="tier" style="min-width:6.5rem;font-size:.8rem;padding:.3rem .5rem">
                      <option value="basic" ${m.min_tier !== 'premium' ? 'selected' : ''}>همه</option>
                      <option value="premium" ${m.min_tier === 'premium' ? 'selected' : ''}>فقط ویژه</option>
                    </select></td>
                <td><button class="btn btn-sm btn-ghost" data-act="del" style="color:var(--danger)">حذف</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  const reload = () => { loaded.delete('ai'); show('ai'); };

  /* ---- پارامترها ---- */
  $('#saveGen').onclick = async () => {
    try {
      await api.post('/api/admin/settings', {
        default_model: $('#dm').value, max_tokens: $('#mt').value,
        temperature: $('#tp').value, top_p: $('#pp').value
      });
      toast('پارامترها ذخیره شد.', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };

  /* ---- فرم ارائه‌دهنده ---- */
  function providerForm(p) {
    const presetOpts = prov.presets.map(x =>
      `<option value="${esc(x.key)}" data-url="${esc(x.base_url)}" data-label="${esc(x.label)}" data-hint="${esc(x.hint)}">${esc(x.label)}</option>`
    ).join('');
    return `
      ${p ? '' : `<div class="field"><label for="pv-preset">سرویس</label>
        <select class="select" id="pv-preset">${presetOpts}</select>
        <span class="hint" id="pv-hint"></span></div>`}
      <div class="field"><label for="pv-key">شناسه یکتا</label>
        <input class="input mono" id="pv-key" value="${esc(p?.key || '')}" ${p ? 'disabled' : ''} placeholder="openai">
        ${p ? '<span class="hint">شناسه پس از ساخت قابل تغییر نیست.</span>' : ''}</div>
      <div class="field"><label for="pv-label">عنوان نمایشی</label>
        <input class="input" id="pv-label" value="${esc(p?.label || '')}" placeholder="OpenAI"></div>
      <div class="field"><label for="pv-url">آدرس پایه</label>
        <input class="input mono" id="pv-url" value="${esc(p?.base_url || '')}" placeholder="https://api.openai.com/v1">
        <span class="hint">بدون اسلش انتهایی. مسیر ‎/chat/completions‎ خودکار اضافه می‌شود.</span></div>
      <div class="field"><label for="pv-apikey">کلید API</label>
        <input class="input mono" id="pv-apikey" type="password" value="${esc(p?.api_key || '')}"
          placeholder="${p?.api_key ? 'برای حفظ کلید فعلی دست نزنید' : 'sk-…'}">
      </div>`;
  }

  $('#addProvider').onclick = () => {
    modal({
      title: 'افزودن ارائه‌دهنده',
      body: providerForm(null),
      actions: [
        { label: 'افزودن', className: 'btn-primary', onClick: async root => {
            try {
              await api.post('/api/admin/providers', {
                key: root.querySelector('#pv-key').value.trim(),
                label: root.querySelector('#pv-label').value.trim(),
                base_url: root.querySelector('#pv-url').value.trim(),
                api_key: root.querySelector('#pv-apikey').value
              });
              toast('ارائه‌دهنده افزوده شد.', 'ok');
              reload();
            } catch (e) { toast(e.message, 'err'); return 'keep'; }
          } },
        { label: 'انصراف' }
      ],
      onOpen: root => {
        const sel = root.querySelector('#pv-preset');
        const apply = () => {
          const o = sel.selectedOptions[0];
          root.querySelector('#pv-key').value = o.value === 'custom' ? '' : o.value;
          root.querySelector('#pv-label').value = o.dataset.label;
          root.querySelector('#pv-url').value = o.dataset.url;
          root.querySelector('#pv-hint').textContent = o.dataset.hint || '';
        };
        sel.onchange = apply;
        apply();
      }
    });
  };

  $('#provList').onclick = async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const card = btn.closest('.prov');
    const id = card.dataset.id;
    const p = prov.items.find(x => String(x.id) === id);
    const out = card.querySelector('.prov-out');
    const act = btn.dataset.act;

    if (act === 'toggle') {
      try { await api.put(`/api/admin/providers/${id}`, { enabled: btn.checked }); toast('ذخیره شد.', 'ok'); reload(); }
      catch (err) { toast(err.message, 'err'); btn.checked = !btn.checked; }
    }

    if (act === 'edit') {
      modal({
        title: `ویرایش ${p.label}`,
        body: providerForm(p),
        actions: [
          { label: 'ذخیره', className: 'btn-primary', onClick: async root => {
              try {
                await api.put(`/api/admin/providers/${id}`, {
                  label: root.querySelector('#pv-label').value.trim(),
                  base_url: root.querySelector('#pv-url').value.trim(),
                  api_key: root.querySelector('#pv-apikey').value
                });
                toast('ذخیره شد.', 'ok');
                reload();
              } catch (err) { toast(err.message, 'err'); return 'keep'; }
            } },
          { label: 'انصراف' }
        ]
      });
    }

    if (act === 'test') {
      btn.disabled = true;
      out.innerHTML = '<div class="alert alert-info" style="margin:.7rem 0 0"><span class="spinner"></span> در حال تماس با سرویس…</div>';
      try {
        const r = await api.post(`/api/admin/providers/${id}/test`);
        out.innerHTML = `<div class="alert alert-success" style="margin:.7rem 0 0">
          ✓ اتصال سالم است — <code>${esc(r.model)}</code> در ${faNum(r.latencyMs)} میلی‌ثانیه پاسخ داد: «${esc(r.reply)}»</div>`;
      } catch (err) {
        out.innerHTML = `<div class="alert alert-danger" style="margin:.7rem 0 0">✗ ${esc(err.message)}
          ${err.data?.detail ? `<br><small class="mono">${esc(err.data.detail)}</small>` : ''}</div>`;
      } finally { btn.disabled = false; }
    }

    if (act === 'browse') {
      btn.disabled = true;
      try {
        const r = await api.get(`/api/admin/providers/${id}/remote-models`);
        const rows = r.models.map(m => `
          <label class="pick">
            <input type="checkbox" value="${esc(m.id)}" ${m.added ? 'disabled' : ''}>
            <span class="mono">${esc(m.id)}</span>
            ${m.added ? '<span class="badge badge-success">ثبت شده</span>' : ''}
          </label>`).join('');
        modal({
          title: `${faNum(r.models.length)} مدل روی حساب ${r.provider}`,
          body: `<p class="hint" style="margin-bottom:.7rem">مدل‌هایی که می‌خواهید در دسترس کاربران باشد را انتخاب کنید.
                   توجه: فهرست شدن یک مدل تضمین نمی‌کند روی حساب شما فعال باشد — بعد از افزودن،
                   با «آزمایش همه مدل‌ها» بررسی کنید.</p>
                 <input class="input" id="pick-filter" placeholder="فیلتر…" style="margin-bottom:.6rem">
                 <div class="pick-list" id="pick-list">${rows}</div>`,
          actions: [
            { label: 'افزودن انتخاب‌شده‌ها', className: 'btn-primary', onClick: async root => {
                const picked = [...root.querySelectorAll('#pick-list input:checked')].map(i => ({ model_id: i.value }));
                if (!picked.length) { toast('چیزی انتخاب نشده.', 'err'); return 'keep'; }
                try {
                  const res = await api.post('/api/admin/models', { provider_id: Number(id), models: picked, enabled: false });
                  toast(`${faNum(res.added)} مدل افزوده شد (خاموش).`, 'ok');
                  reload();
                } catch (err) { toast(err.message, 'err'); return 'keep'; }
              } },
            { label: 'بستن' }
          ],
          onOpen: root => {
            const f = root.querySelector('#pick-filter');
            f.oninput = () => {
              const q = f.value.trim().toLowerCase();
              root.querySelectorAll('#pick-list .pick').forEach(el => {
                el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
              });
            };
          }
        });
      } catch (err) { toast(err.message, 'err'); }
      finally { btn.disabled = false; }
    }

    if (act === 'del') {
      if (!await confirmDialog('حذف ارائه‌دهنده',
        `${p.label} و همه ${p.models} مدل ثبت‌شده‌اش حذف می‌شوند. تحلیل‌های گذشته دست‌نخورده می‌مانند.`, 'حذف کن')) return;
      try { await api.del(`/api/admin/providers/${id}?force=1`); toast('حذف شد.', 'ok'); reload(); }
      catch (err) { toast(err.message, 'err'); }
    }
  };

  /* ---- مدل‌ها ---- */
  $('#addModel').onclick = () => {
    modal({
      title: 'افزودن مدل',
      body: `
        <div class="field"><label for="nm-prov">ارائه‌دهنده</label>
          <select class="select" id="nm-prov">
            ${prov.items.map(p => `<option value="${p.id}">${esc(p.label)}</option>`).join('')}
          </select></div>
        <div class="field"><label for="nm-id">شناسه مدل</label>
          <input class="input mono" id="nm-id" placeholder="gpt-4o"></div>
        <div class="field"><label for="nm-label">عنوان نمایشی</label>
          <input class="input" id="nm-label" placeholder="GPT-4o"></div>
        <div class="field"><label for="nm-note">توضیح کوتاه</label>
          <input class="input" id="nm-note" placeholder="مناسب تحلیل‌های عمیق"></div>`,
      actions: [
        { label: 'افزودن', className: 'btn-primary', onClick: async root => {
            try {
              await api.post('/api/admin/models', {
                provider_id: Number(root.querySelector('#nm-prov').value),
                model_id: root.querySelector('#nm-id').value.trim(),
                label: root.querySelector('#nm-label').value.trim(),
                note: root.querySelector('#nm-note').value.trim()
              });
              toast('مدل افزوده شد.', 'ok');
              reload();
            } catch (e) { toast(e.message, 'err'); return 'keep'; }
          } },
        { label: 'انصراف' }
      ]
    });
  };

  $('#probeModels').onclick = async e => {
    e.target.disabled = true;
    const out = $('#probeOut');
    out.innerHTML = '<div class="alert alert-info" style="margin:1rem 1.4rem"><span class="spinner"></span> در حال آزمایش هر مدل با یک درخواست کوچک… چند لحظه صبر کنید.</div>';
    try {
      const r = await api.post('/api/admin/models/probe', { onlyEnabled: false });
      out.innerHTML = `
        <div style="margin:1rem 1.4rem">
          <div class="alert ${r.broken ? 'alert-warn' : 'alert-success'}">
            ${faNum(r.ok)} مدل از ${faNum(r.total)} پاسخ داد${r.broken ? `، ${faNum(r.broken)} مدل خطا داد.` : '.'}
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>مدل</th><th>ارائه‌دهنده</th><th>نتیجه</th></tr></thead>
            <tbody>${r.results.map(x => `
              <tr>
                <td class="mono" style="font-size:.75rem">${esc(x.model)}</td>
                <td><small>${esc(x.provider)}</small></td>
                <td>${x.ok
                  ? `<span class="badge badge-success">${faNum(x.latencyMs)} م‌ث</span>`
                  : `<span class="badge badge-danger">خطا</span> <small style="color:var(--text-muted)">${esc(String(x.error).slice(0, 70))}</small>`}</td>
              </tr>`).join('')}</tbody>
          </table></div>
        </div>`;
    } catch (err) { out.innerHTML = `<div class="alert alert-danger" style="margin:1rem 1.4rem">${esc(err.message)}</div>`; }
    finally { e.target.disabled = false; }
  };

  $('#modelRows').onchange = async e => {
    const sel = e.target.closest('select[data-act="tier"]');
    if (!sel) return;
    const id = sel.closest('tr').dataset.id;
    try {
      await api.put(`/api/admin/models/${id}`, { min_tier: sel.value });
      toast(sel.value === 'premium' ? 'این مدل حالا فقط برای گروه ویژه است.' : 'این مدل برای همه گروه‌ها باز شد.', 'ok');
    } catch (err) { toast(err.message, 'err'); }
  };

  $('#modelRows').onclick = async e => {
    const row = e.target.closest('tr');
    if (!row) return;
    const id = row.dataset.id;
    if (e.target.dataset.act === 'toggle') {
      try { await api.put(`/api/admin/models/${id}`, { enabled: e.target.checked }); toast('ذخیره شد.', 'ok'); }
      catch (err) { toast(err.message, 'err'); e.target.checked = !e.target.checked; }
    }
    if (e.target.dataset.act === 'del') {
      if (!await confirmDialog('حذف مدل', 'این مدل از فهرست انتخاب کاربران حذف می‌شود.', 'حذف')) return;
      try { await api.del(`/api/admin/models/${id}`); row.remove(); toast('حذف شد.', 'ok'); }
      catch (err) { toast(err.message, 'err'); }
    }
  };
};

/* ---------------- دستور تحلیل ---------------- */
loaders.prompts = async () => {
  const host = $('#p-prompts');
  host.innerHTML = '<div class="skeleton" style="height:8rem"></div>';
  const data = await api.get('/api/admin/prompts');
  let current = data.items.find(p => p.key === data.activeKey) || data.items[0];

  host.innerHTML = `
    <h2 class="sec-h">دستور تحلیل مدل</h2>
    <p class="sec-p">این متن به‌عنوان پیام سیستمی برای هر تحلیل فرستاده می‌شود و لحن، عمق و قالب خروجی را تعیین می‌کند.
      قالب بلوک‌ها (<span class="var-chip">@@key@@</span>) باید حفظ شود، وگرنه نتیجه در کارت‌ها نمی‌نشیند.</p>

    <div class="alert alert-warn">
      <strong>کلیدهای ضروری:</strong>
      <span class="var-chip">@@reframe@@</span><span class="var-chip">@@stakeholders@@</span><span class="var-chip">@@options@@</span>
      <span class="var-chip">@@school:virtue@@</span> … <span class="var-chip">@@school:nietzsche@@</span>
      <span class="var-chip">@@gate:dignity@@</span> … <span class="var-chip">@@gate:authenticity@@</span>
      <span class="var-chip">@@tensions@@</span><span class="var-chip">@@recommendation@@</span>
      <span class="var-chip">@@questions@@</span><span class="var-chip">@@blindspots@@</span>
    </div>

    <div class="split">
      <div class="card">
        <div class="card-head" style="padding:.85rem 1rem"><h3 style="font-size:.92rem">نسخه‌ها</h3>
          <button class="btn btn-sm" id="newPrompt">＋</button></div>
        <div class="card-body" style="padding:.7rem">
          <div class="plist" id="plist"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3 id="pTitle">—</h3>
          <div class="row" style="gap:.4rem">
            <button class="btn btn-sm" id="restoreDefault">بازگرداندن متن کارخانه</button>
            <button class="btn btn-sm" id="activatePrompt">فعال‌سازی</button>
            <button class="btn btn-sm btn-primary" id="savePrompt">ذخیره</button>
          </div>
        </div>
        <div class="card-body">
          <div class="field">
            <label for="pLabel">عنوان نسخه</label>
            <input class="input" id="pLabel">
          </div>
          <div class="field">
            <label for="pContent">متن دستور</label>
            <textarea class="textarea code-area" id="pContent"></textarea>
          </div>
          <button class="btn btn-sm btn-ghost" id="delPrompt" style="color:var(--danger)">حذف این نسخه</button>
        </div>
      </div>
    </div>`;

  const renderList = () => {
    $('#plist').innerHTML = data.items.map(p => `
      <button data-id="${p.id}" class="${p.id === current.id ? 'active' : ''}">
        ${esc(p.label)}
        <small>${p.key === data.activeKey ? '● فعال' : 'غیرفعال'} — ${relTime(p.updated_at)}</small>
      </button>`).join('');
  };

  const renderEditor = () => {
    $('#pTitle').innerHTML = `${esc(current.label)} ${current.key === data.activeKey ? '<span class="badge badge-success">فعال</span>' : ''}`;
    $('#pLabel').value = current.label;
    $('#pContent').value = current.content;
  };

  renderList(); renderEditor();

  $('#plist').onclick = e => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    current = data.items.find(p => p.id === +b.dataset.id);
    renderList(); renderEditor();
  };

  $('#savePrompt').onclick = async () => {
    try {
      await api.put(`/api/admin/prompts/${current.id}`, {
        label: $('#pLabel').value.trim(), content: $('#pContent').value
      });
      current.label = $('#pLabel').value.trim();
      current.content = $('#pContent').value;
      current.updated_at = new Date().toISOString();
      renderList(); renderEditor();
      toast('دستور ذخیره شد.', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };

  $('#activatePrompt').onclick = async () => {
    try {
      const r = await api.post(`/api/admin/prompts/${current.id}/activate`);
      data.activeKey = r.activeKey;
      renderList(); renderEditor();
      toast('این نسخه فعال شد.', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };

  $('#restoreDefault').onclick = async () => {
    if (!await confirmDialog('بازگرداندن متن کارخانه', 'متن فعلی ویرایشگر با نسخه پیش‌فرض جایگزین می‌شود. تا وقتی ذخیره نکنید تغییری ثبت نمی‌شود.', 'جایگزین کن')) return;
    $('#pContent').value = data.factoryDefault;
    toast('متن کارخانه بارگذاری شد — برای ثبت، ذخیره کنید.');
  };

  $('#newPrompt').onclick = () => {
    modal({
      title: 'نسخه تازه دستور',
      body: `<div class="field"><label for="np-key">کلید یکتا (انگلیسی)</label>
               <input class="input mono" id="np-key" placeholder="core-fa-v2"></div>
             <div class="field"><label for="np-label">عنوان</label>
               <input class="input" id="np-label" placeholder="نسخه آزمایشی"></div>
             <label class="switch"><input type="checkbox" id="np-copy" checked> شروع از روی نسخه فعلی</label>`,
      actions: [
        { label: 'ساختن', className: 'btn-primary', onClick: async root => {
            try {
              await api.post('/api/admin/prompts', {
                key: root.querySelector('#np-key').value.trim(),
                label: root.querySelector('#np-label').value.trim(),
                content: root.querySelector('#np-copy').checked ? $('#pContent').value : data.factoryDefault
              });
              toast('نسخه ساخته شد.', 'ok');
              loaded.delete('prompts'); show('prompts');
            } catch (e) { toast(e.message, 'err'); return 'keep'; }
          } },
        { label: 'انصراف' }
      ]
    });
  };

  $('#delPrompt').onclick = async () => {
    if (!await confirmDialog('حذف نسخه', `نسخه «${current.label}» حذف شود؟`, 'حذف')) return;
    try {
      await api.del(`/api/admin/prompts/${current.id}`);
      toast('حذف شد.', 'ok');
      loaded.delete('prompts'); show('prompts');
    } catch (e) { toast(e.message, 'err'); }
  };
};

/* ---------------- کاربران ---------------- */
loaders.users = async () => {
  const host = $('#p-users');
  host.innerHTML = `
    <h2 class="sec-h">کاربران</h2>
    <p class="sec-p">
      گروه، نقش، وضعیت و مصرف هر کاربر. سقف‌ها از گروه به ارث می‌رسند؛
      عددی که با <span class="badge">استثنا</span> نشان داده شده یعنی برای آن کاربر دستی تنظیم شده است.
    </p>
    <div class="row" style="margin-bottom:1rem">
      <input class="input" id="uq" style="max-width:320px" type="search" placeholder="جست‌وجو در نام یا ایمیل…">
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>کاربر</th><th>گروه</th><th>نقش</th><th>وضعیت</th>
        <th>سهمیه روزانه</th><th>توکن این ماه</th><th>کل توکن</th><th>تحلیل</th><th></th>
      </tr></thead>
      <tbody id="uRows"></tbody></table></div>
    <div class="pager" id="uPager" style="display:flex;justify-content:center;gap:.4rem;margin-top:1rem"></div>`;

  let upage = 1, uq = '';

  async function loadUsers() {
    const p = new URLSearchParams({ page: upage });
    if (uq) p.set('q', uq);
    const d = await api.get('/api/admin/users?' + p);
    const fmtT = n => n >= 1000 ? faNum((n / 1000).toFixed(n >= 10000 ? 0 : 1)) + 'K' : faNum(n);

    $('#uRows').innerHTML = d.items.map(u => {
      const lvl = u.tokenPercent === null ? '' :
        u.tokenPercent >= 90 ? 'badge-danger' : u.tokenPercent >= 70 ? 'badge-warn' : 'badge-success';
      return `
      <tr data-id="${u.id}">
        <td><strong>${esc(u.name)}</strong><br><small class="mono" style="color:var(--text-muted)">${esc(u.email)}</small></td>
        <td><span class="badge ${u.tier === 'premium' ? 'badge-primary' : ''}">${esc(u.tierLabel)}</span></td>
        <td>${u.role === 'admin' ? '<span class="badge badge-primary">مدیر</span>' : '<span class="badge">کاربر</span>'}</td>
        <td>${u.status === 'active' ? '<span class="badge badge-success">فعال</span>' : '<span class="badge badge-danger">مسدود</span>'}</td>
        <td>${faNum(u.todayAnalyses)} / ${faNum(u.effectiveQuota)}
            ${u.quota_override !== null ? '<br><span class="badge">استثنا</span>' : ''}</td>
        <td>${u.effectiveTokens > 0
              ? `${fmtT(u.monthTokens)} / ${fmtT(u.effectiveTokens)}
                 <br><span class="badge ${lvl}">${faNum(u.tokenPercent)}٪</span>`
              : `${fmtT(u.monthTokens)}<br><span class="badge">بی‌نهایت</span>`}
            ${u.token_override !== null ? '<br><span class="badge">استثنا</span>' : ''}</td>
        <td class="mono" style="font-size:.8rem">${fmtT(u.totalTokens)}</td>
        <td>${faNum(u.analyses)}</td>
        <td><button class="btn btn-sm" data-act="edit">ویرایش</button></td>
      </tr>`;
    }).join('') || '<tr><td colspan="9" style="text-align:center;color:var(--text-muted)">کاربری یافت نشد</td></tr>';

    window.__tiers = d.tiers || [];
    window.__users = Object.fromEntries(d.items.map(u => [u.id, u]));

    $('#uPager').innerHTML = d.pages > 1
      ? Array.from({ length: d.pages }, (_, i) =>
          `<button class="btn btn-sm ${i + 1 === d.page ? 'btn-primary' : ''}" data-page="${i + 1}">${faNum(i + 1)}</button>`).join('')
      : '';
  }

  let t;
  $('#uq').oninput = e => { clearTimeout(t); t = setTimeout(() => { uq = e.target.value.trim(); upage = 1; loadUsers(); }, 300); };
  $('#uPager').onclick = e => {
    const b = e.target.closest('button[data-page]');
    if (b) { upage = +b.dataset.page; loadUsers(); }
  };

  $('#uRows').onclick = async e => {
    const b = e.target.closest('button[data-act="edit"]');
    if (!b) return;
    const id = b.closest('tr').dataset.id;
    const u = (window.__users || {})[id];
    if (!u) return toast('اطلاعات کاربر در دسترس نیست — صفحه را تازه کنید.', 'err');

    const tiers = window.__tiers || [];
    const fmtT = n => n >= 1000 ? faNum((n / 1000).toFixed(n >= 10000 ? 0 : 1)) + 'K' : faNum(n);

    modal({
      title: `ویرایش ${u.name}`,
      body: `
        <div class="field"><label for="eu-name">نام</label>
          <input class="input" id="eu-name" value="${esc(u.name)}"></div>

        <div class="grid-2">
          <div class="field"><label for="eu-tier">گروه کاربری</label>
            <select class="select" id="eu-tier">
              ${tiers.map(t => `<option value="${esc(t.key)}" ${t.key === u.tier ? 'selected' : ''}>
                ${esc(t.label)} — ${faNum(t.daily_quota)} تحلیل، ${t.monthly_tokens > 0 ? fmtT(t.monthly_tokens) + ' توکن' : 'توکن بی‌نهایت'}
              </option>`).join('')}
            </select></div>
          <div class="field"><label for="eu-role">نقش</label>
            <select class="select" id="eu-role">
              <option value="user" ${u.role !== 'admin' ? 'selected' : ''}>کاربر عادی</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>مدیر سامانه</option>
            </select></div>
        </div>

        <div class="field"><label for="eu-status">وضعیت</label>
          <select class="select" id="eu-status">
            <option value="active" ${u.status === 'active' ? 'selected' : ''}>فعال</option>
            <option value="suspended" ${u.status !== 'active' ? 'selected' : ''}>مسدود</option>
          </select></div>

        <hr style="border:none;border-top:1px solid var(--border);margin:1.2rem 0">

        <p class="hint" style="margin-bottom:.8rem">
          <strong>استثنای فردی:</strong> این دو فیلد را خالی بگذارید تا کاربر سقف‌های گروهش را
          به ارث ببرد. عدد بگذارید تا فقط برای همین کاربر متفاوت باشد.
        </p>

        <div class="grid-2">
          <div class="field"><label for="eu-quota">سقف تحلیل روزانه</label>
            <input class="input" id="eu-quota" type="number" min="0" max="10000"
                   placeholder="از گروه" value="${u.quota_override ?? ''}">
            <span class="hint">اکنون مؤثر: ${faNum(u.effectiveQuota)} تحلیل</span></div>
          <div class="field"><label for="eu-tokens">سقف توکن ماهانه</label>
            <input class="input" id="eu-tokens" type="number" min="0" step="10000"
                   placeholder="از گروه" value="${u.token_override ?? ''}">
            <span class="hint">اکنون مؤثر: ${u.effectiveTokens > 0 ? fmtT(u.effectiveTokens) : 'بی‌نهایت'} — ۰ یعنی بی‌نهایت</span></div>
        </div>

        <div class="alert alert-info" style="font-size:.83rem">
          مصرف این ماه: <strong>${fmtT(u.monthTokens)}</strong> توکن •
          مجموع کل: <strong>${fmtT(u.totalTokens)}</strong> توکن •
          ${faNum(u.analyses)} تحلیل
        </div>

        <hr style="border:none;border-top:1px solid var(--border);margin:1.1rem 0">
        <div class="field"><label for="eu-pass">تعیین رمز تازه (اختیاری)</label>
          <input class="input" id="eu-pass" type="password" placeholder="خالی بگذارید تا تغییری نکند"></div>`,
      actions: [
        { label: 'ذخیره', className: 'btn-primary', onClick: async root => {
            try {
              await api.put(`/api/admin/users/${id}`, {
                name: root.querySelector('#eu-name').value.trim(),
                tier: root.querySelector('#eu-tier').value,
                role: root.querySelector('#eu-role').value,
                status: root.querySelector('#eu-status').value,
                quota_override: root.querySelector('#eu-quota').value,
                token_override: root.querySelector('#eu-tokens').value
              });
              const pw = root.querySelector('#eu-pass').value;
              if (pw) await api.post(`/api/admin/users/${id}/reset-password`, { password: pw });
              toast('ذخیره شد.', 'ok');
              loadUsers();
            } catch (err) { toast(err.message, 'err'); return 'keep'; }
          } },
        { label: 'حذف کاربر', className: 'btn-danger', onClick: async () => {
            if (!await confirmDialog('حذف کاربر', `${u.name} و همه تحلیل‌هایش برای همیشه حذف می‌شوند.`, 'حذف کن')) return 'keep';
            try { await api.del(`/api/admin/users/${id}`); toast('حذف شد.', 'ok'); loadUsers(); }
            catch (err) { toast(err.message, 'err'); return 'keep'; }
          } },
        { label: 'انصراف' }
      ]
    });
  };

  loadUsers();
};

/* ---------------- گروه‌های کاربری ---------------- */
loaders.tiers = async () => {
  const host = $('#p-tiers');
  host.innerHTML = '<div class="skeleton" style="height:8rem"></div>';
  const d = await api.get('/api/admin/tiers');

  const fmt = n => n > 0 ? n.toLocaleString('en') : 'بی‌نهایت';

  host.innerHTML = `
    <h2 class="sec-h">گروه‌های کاربری</h2>
    <p class="sec-p">
      هر کاربر در یکی از این گروه‌هاست و سقف‌هایش را از گروه به ارث می‌برد.
      تغییر سقف یک گروه بلافاصله روی همه اعضایش اثر می‌گذارد — مگر کسانی که
      در تب «کاربران» برایشان استثنای فردی گذاشته باشید.
    </p>

    <div class="stat-grid" style="margin-bottom:1.25rem">
      ${d.items.map(t => `
        <div class="stat">
          <div class="stat-label">🎟️ ${esc(t.label)}</div>
          <div class="stat-value">${faNum(t.users)}</div>
          <div class="stat-sub">کاربر در این گروه</div>
        </div>`).join('')}
    </div>

    <div class="table-wrap"><table>
      <thead><tr>
        <th>گروه</th><th>نام نمایشی</th><th>تحلیل روزانه</th>
        <th>توکن ماهانه</th><th>کاربران</th><th>مدل اختصاصی</th><th></th>
      </tr></thead>
      <tbody>
        ${d.items.map(t => `
          <tr data-id="${t.id}">
            <td><span class="badge ${t.key === 'premium' ? 'badge-primary' : ''}">${esc(t.key)}</span></td>
            <td><input class="input" data-f="label" value="${esc(t.label)}" style="min-width:8rem"></td>
            <td><input class="input" data-f="daily_quota" type="number" min="0" max="10000"
                       value="${t.daily_quota}" style="width:6.5rem"></td>
            <td><input class="input" data-f="monthly_tokens" type="number" min="0" step="10000"
                       value="${t.monthly_tokens}" style="width:9rem">
                <div class="hint">${fmt(t.monthly_tokens)} — ۰ یعنی بی‌نهایت</div></td>
            <td>${faNum(t.users)}</td>
            <td>${t.key === 'basic' ? '—' : faNum(t.exclusiveModels) + ' مدل'}</td>
            <td><button class="btn btn-sm btn-primary" data-act="save">ذخیره</button></td>
          </tr>`).join('')}
      </tbody></table></div>

    <div class="alert alert-info" style="margin-top:1.1rem">
      برای اینکه مدلی فقط در دسترس گروه ویژه باشد، به تب «مدل و کلید» بروید و
      «دسترسی» آن مدل را روی <strong>ویژه</strong> بگذارید.
    </div>`;

  host.querySelector('tbody').onclick = async e => {
    const btn = e.target.closest('[data-act="save"]');
    if (!btn) return;
    const row = btn.closest('tr');
    const val = f => row.querySelector(`[data-f="${f}"]`).value;
    btn.disabled = true;
    try {
      await api.put(`/api/admin/tiers/${row.dataset.id}`, {
        label: val('label'),
        daily_quota: val('daily_quota'),
        monthly_tokens: val('monthly_tokens')
      });
      toast('گروه ذخیره شد.', 'ok');
      loaded.delete('tiers'); show('tiers');
    } catch (err) { toast(err.message, 'err'); }
    finally { btn.disabled = false; }
  };
};

/* ---------------- تحلیل‌ها ---------------- */
loaders.analyses = async () => {
  const host = $('#p-analyses');
  host.innerHTML = `
    <h2 class="sec-h">تحلیل‌های ثبت‌شده</h2>
    <p class="sec-p">فهرست همه تحلیل‌های سامانه. متن تحلیل کاربران از اینجا قابل مشاهده نیست.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>عنوان</th><th>کاربر</th><th>مدل</th><th>وضعیت</th><th>زمان</th><th>تاریخ</th></tr></thead>
      <tbody id="aRows"></tbody></table></div>
    <div class="pager" id="aPager" style="display:flex;justify-content:center;gap:.4rem;margin-top:1rem"></div>`;

  let apage = 1;
  async function loadA() {
    const d = await api.get('/api/admin/analyses?page=' + apage);
    $('#aRows').innerHTML = d.items.map(a => `
      <tr>
        <td style="max-width:280px">${esc(a.title)}</td>
        <td><small class="mono" style="color:var(--text-muted)">${esc(a.email)}</small></td>
        <td class="mono" style="font-size:.75rem">${esc(a.model)}</td>
        <td>${a.status === 'done' ? '<span class="badge badge-success">کامل</span>'
             : a.status === 'error' ? '<span class="badge badge-danger">خطا</span>'
             : '<span class="badge badge-warn">ناتمام</span>'}</td>
        <td>${duration(a.duration_ms)}</td>
        <td style="font-size:.78rem;color:var(--text-muted)">${relTime(a.created_at)}</td>
      </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">هنوز تحلیلی ثبت نشده</td></tr>';

    $('#aPager').innerHTML = d.pages > 1
      ? Array.from({ length: Math.min(d.pages, 12) }, (_, i) =>
          `<button class="btn btn-sm ${i + 1 === d.page ? 'btn-primary' : ''}" data-page="${i + 1}">${faNum(i + 1)}</button>`).join('')
      : '';
  }
  $('#aPager').onclick = e => {
    const b = e.target.closest('button[data-page]');
    if (b) { apage = +b.dataset.page; loadA(); }
  };
  loadA();
};

    <p class="sec-p">نام سامانه، سیاست ثبت‌نام و سهمیه پیش‌فرض کاربران تازه.</p>
    <div class="card"><div class="card-body">
      <div class="field"><label for="st-title">نام سامانه</label>

      <div class="field"><label for="st-tag">شعار</label>
        <input class="input" id="st-tag" value="${esc(s.site_tagline)}"></div>
      <div class="field"><label for="st-quota">سهمیه روزانه کاربران تازه</label>
        <input class="input" id="st-quota" type="number" min="1" max="1000" value="${esc(s.default_daily_quota)}">
        <span class="hint">سهمیه کاربران موجود از بخش «کاربران» جداگانه قابل تنظیم است.</span></div>
      <label class="switch" style="margin-bottom:1.2rem">
        <input type="checkbox" id="st-reg" ${s.allow_registration === '1' ? 'checked' : ''}>
        ثبت‌نام عمومی باز باشد
      </label>
      <div><button class="btn btn-primary" id="saveSite">ذخیره</button></div>
    </div></div>`;

  $('#saveSite').onclick = async () => {
    try {
      await api.post('/api/admin/settings', {

        default_daily_quota: $('#st-quota').value,

/* ---------------- سلامت سرویس ---------------- */
async function refreshHealth() {
  try {
    const d = await api.get('/api/admin/overview');
    const b = $('#healthBadge');
    const ready = d.providers.filter(p => p.enabled && p.hasKey).length;
    if (d.activeModels && d.defaultOk) {
      b.className = 'badge badge-success';
      b.textContent = `● ${faNum(ready)} ارائه‌دهنده، ${faNum(d.activeModels)} مدل فعال`;
    } else if (d.activeModels) {
      b.className = 'badge badge-warn';
      b.textContent = '● مدل پیش‌فرض تنظیم نشده';
    } else {
      b.className = 'badge badge-danger';
      b.textContent = '● هیچ مدل فعالی نیست';
    }
  } catch { $('#healthBadge').textContent = '—'; }
}
refreshHealth();

show(location.hash.slice(1) || 'overview');

initMotion();
</script>
