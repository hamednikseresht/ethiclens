<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل مدیریت — اتیکا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .admin-layout{display:grid;grid-template-columns:1fr;gap:1.25rem;align-items:start}
  @media (min-width:960px){
    .admin-layout{grid-template-columns:210px 1fr}
    .side{position:sticky;top:calc(var(--nav-h) + 1.5rem)}
  }
  .side{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.4rem;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  @media (min-width:960px){.side{flex-direction:column;overflow:visible}}
  .side button{
    display:flex;align-items:center;gap:.55rem;padding:.6rem .85rem;border-radius:10px;
    border:1px solid transparent;background:none;font-family:inherit;font-size:.88rem;font-weight:700;
    color:var(--text-muted);cursor:pointer;white-space:nowrap;text-align:start;width:100%;
  }
  .side button:hover{background:var(--bg-subtle);color:var(--text)}
  .side button.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
  .panel{display:none}
  .panel.active{display:block}
  .sec-h{font-size:1.15rem;font-weight:900;margin-bottom:.25rem}
  .sec-p{font-size:.85rem;color:var(--text-muted);margin-bottom:1.1rem;line-height:1.75}
  .code-area{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;line-height:1.75;
             direction:rtl;min-height:420px;white-space:pre-wrap}
  .var-chip{display:inline-block;background:var(--bg-inset);border-radius:6px;padding:.05rem .4rem;
            font-family:ui-monospace,monospace;font-size:.78rem;direction:ltr;margin-inline-end:.3rem}
  .split{display:grid;grid-template-columns:1fr;gap:1rem}
  @media (min-width:1100px){.split{grid-template-columns:260px 1fr}}
  .plist{display:flex;flex-direction:column;gap:.35rem;max-height:480px;overflow:auto}
  .plist button{text-align:start;padding:.6rem .8rem;border-radius:9px;border:1px solid var(--border);
                background:var(--bg-surface);font-family:inherit;font-size:.85rem;cursor:pointer;color:var(--text)}
  .plist button.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}
  .plist small{display:block;color:var(--text-muted);font-size:.72rem;font-weight:400}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="row-between" style="margin-bottom:1.2rem">
    <div>
      <h1 style="font-size:1.35rem;font-weight:900">پنل مدیریت</h1>
      <p style="font-size:.86rem;color:var(--text-muted)">تنظیم مدل، دستور تحلیل، کاربران و گزارش‌ها</p>
    </div>
    <span class="badge badge-primary" id="healthBadge">در حال بررسی…</span>
  </div>

  <div class="admin-layout">
    <nav class="side" id="sideNav">
      <button data-tab="overview" class="active">📊 نمای کلی</button>
      <button data-tab="ai">🤖 مدل و کلید</button>
      <button data-tab="prompts">📝 دستور تحلیل</button>
      <button data-tab="users">👥 کاربران</button>
      <button data-tab="analyses">🗂️ تحلیل‌ها</button>
      <button data-tab="site">⚙️ تنظیمات سایت</button>
      <button data-tab="audit">🔒 گزارش رخدادها</button>
    </nav>

    <div>
      <section class="panel active" id="p-overview"></section>
      <section class="panel" id="p-ai"></section>
      <section class="panel" id="p-prompts"></section>
      <section class="panel" id="p-users"></section>
      <section class="panel" id="p-analyses"></section>
      <section class="panel" id="p-site"></section>
      <section class="panel" id="p-audit"></section>
    </div>
  </div>
</main>

<script type="module">
import { $, $$, api, boot, esc, faNum, faDate, relTime, duration, toast, confirmDialog, modal } from '/js/core.js';

if (!await boot({ admin: true })) throw new Error('forbidden');

/* ---------------- ناوبری تب‌ها ---------------- */
const loaders = {};
let loaded = new Set();

function show(tab) {
  $$('#sideNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $$('.panel').forEach(p => p.classList.toggle('active', p.id === `p-${tab}`));
  location.hash = tab;
  if (!loaded.has(tab)) { loaded.add(tab); loaders[tab]?.(); }
}
$('#sideNav').onclick = e => {
  const b = e.target.closest('button[data-tab]');
  if (b) show(b.dataset.tab);
};

/* ---------------- نمای کلی ---------------- */
loaders.overview = async () => {
  const host = $('#p-overview');
  host.innerHTML = '<div class="skeleton" style="height:8rem"></div>';
  const d = await api.get('/api/admin/overview');

  const byDay = Object.fromEntries((d.daily || []).map(x => [x.d, x.c]));
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    const k = dt.toISOString().slice(0, 10);
    days.push({ k, c: byDay[k] || 0 });
  }
  const max = Math.max(1, ...days.map(x => x.c));

  host.innerHTML = `
    <h2 class="sec-h">نمای کلی سامانه</h2>
    <p class="sec-p">وضعیت لحظه‌ای کاربران، تحلیل‌ها و مصرف مدل.</p>

    ${d.apiKeySet ? '' : '<div class="alert alert-warn">کلید API انویدیا هنوز ثبت نشده است. تا وقتی کلید را در بخش «مدل و کلید» وارد نکنید، هیچ تحلیلی انجام نمی‌شود.</div>'}

    <div class="stat-grid" style="margin-bottom:1.25rem">
      <div class="stat"><div class="stat-label">👥 کاربران</div>
        <div class="stat-value">${faNum(d.users.total)}</div>
        <div class="stat-sub">${faNum(d.users.newWeek || 0)} کاربر تازه این هفته</div></div>
      <div class="stat"><div class="stat-label">🗂️ کل تحلیل‌ها</div>
        <div class="stat-value">${faNum(d.analyses.total)}</div>
        <div class="stat-sub">${faNum(d.analyses.today || 0)} مورد امروز</div></div>
      <div class="stat"><div class="stat-label">⚠️ ناموفق</div>
        <div class="stat-value">${faNum(d.analyses.failed || 0)}</div>
        <div class="stat-sub">از ${faNum(d.analyses.total)} درخواست</div></div>
      <div class="stat"><div class="stat-label">🔢 توکن مصرفی</div>
        <div class="stat-value" style="font-size:1.3rem">${faNum(((d.analyses.tokensIn + d.analyses.tokensOut) / 1000).toFixed(1))}K</div>
        <div class="stat-sub">ورودی + خروجی</div></div>
    </div>

    <div class="card" style="margin-bottom:1.1rem">
      <div class="card-head"><h3>📈 تحلیل‌ها در ۳۰ روز اخیر</h3>
        <span class="badge">میانگین زمان: ${faNum((d.analyses.avgMs / 1000).toFixed(1))} ثانیه</span></div>
      <div class="card-body">
        <div class="bars">${days.map(x =>
          `<div class="bar" data-v="${x.c}" style="height:${Math.max(4, (x.c / max) * 100)}%" title="${x.k}: ${x.c}"></div>`).join('')}</div>
      </div>
    </div>

    <div class="split" style="grid-template-columns:1fr">
      <div class="card">
        <div class="card-head"><h3>🤖 مصرف به تفکیک مدل</h3></div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table><thead><tr><th>مدل</th><th>تعداد</th><th>میانگین زمان</th></tr></thead>
          <tbody>${d.byModel.length ? d.byModel.map(m => `
            <tr><td class="mono" style="font-size:.8rem">${esc(m.model)}</td>
                <td>${faNum(m.c)}</td><td>${faNum((m.avgMs / 1000).toFixed(1))} ث</td></tr>`).join('')
            : '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">داده‌ای نیست</td></tr>'}</tbody></table>
        </div>
      </div>

      <div class="card" style="margin-top:1.1rem">
        <div class="card-head"><h3>🏆 فعال‌ترین کاربران</h3></div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table><thead><tr><th>کاربر</th><th>ایمیل</th><th>تحلیل</th></tr></thead>
          <tbody>${d.topUsers.map(u => `
            <tr><td>${esc(u.name)}</td>
                <td class="mono" style="font-size:.78rem">${esc(u.email)}</td>
                <td>${faNum(u.c)}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
    </div>`;
};

/* ---------------- مدل و کلید ---------------- */
loaders.ai = async () => {
  const host = $('#p-ai');
  host.innerHTML = '<div class="skeleton" style="height:8rem"></div>';
  const [s, models] = await Promise.all([api.get('/api/admin/settings'), api.get('/api/admin/models')]);

  host.innerHTML = `
    <h2 class="sec-h">مدل هوش مصنوعی و کلید دسترسی</h2>
    <p class="sec-p">اتیکا از سرویس سازگار با OpenAI روی NVIDIA NIM استفاده می‌کند. کلید در پایگاه داده ذخیره می‌شود و هرگز به مرورگر کاربران فرستاده نمی‌شود.</p>

    <div class="card" style="margin-bottom:1.1rem">
      <div class="card-head"><h3>🔑 اتصال به سرویس</h3></div>
      <div class="card-body">
        <div class="field">
          <label for="ak">کلید API انویدیا</label>
          <input class="input mono" id="ak" type="password" placeholder="nvapi-…" value="${esc(s.nvidia_api_key)}">
          <span class="hint">برای حفظ کلید فعلی، این فیلد را دست‌نخورده بگذارید.</span>
        </div>
        <div class="field">
          <label for="bu">آدرس پایه سرویس</label>
          <input class="input mono" id="bu" value="${esc(s.nvidia_base_url)}">
        </div>
        <div class="row">
          <button class="btn btn-primary" id="saveKey">ذخیره</button>
          <button class="btn" id="testKey">🔌 آزمایش اتصال</button>
          <button class="btn btn-ghost" id="fetchRemote">دریافت فهرست مدل‌های حساب</button>
        </div>
        <div id="testOut" style="margin-top:.9rem"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.1rem">
      <div class="card-head"><h3>🎛️ پارامترهای تولید</h3></div>
      <div class="card-body">
        <div class="grid-2">
          <div class="field">
            <label for="dm">مدل پیش‌فرض</label>
            <select class="select" id="dm">
              ${models.map(m => `<option value="${esc(m.model_id)}" ${m.model_id === s.default_model ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}
            </select>
            <span class="hint">مدلی که وقتی کاربر انتخابی نکرده استفاده می‌شود.</span>
          </div>
          <div class="field">
            <label for="mt">حداکثر توکن پاسخ</label>
            <input class="input" id="mt" type="number" min="512" max="16384" step="256" value="${esc(s.max_tokens)}">
            <span class="hint">تحلیل کامل معمولاً بین ۳۰۰۰ تا ۵۰۰۰ توکن می‌گیرد.</span>
          </div>
          <div class="field">
            <label for="tp">دما (temperature)</label>
            <input class="input" id="tp" type="number" min="0" max="2" step="0.05" value="${esc(s.temperature)}">
            <span class="hint">پایین‌تر = محافظه‌کارتر و یکنواخت‌تر. پیشنهاد: ۰٫۵ تا ۰٫۷</span>
          </div>
          <div class="field">
            <label for="pp">top_p</label>
            <input class="input" id="pp" type="number" min="0" max="1" step="0.01" value="${esc(s.top_p)}">
          </div>
        </div>
        <button class="btn btn-primary" id="saveGen">ذخیره پارامترها</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>📚 مدل‌های در دسترس کاربران</h3>
        <button class="btn btn-sm btn-primary" id="addModel">＋ افزودن مدل</button>
      </div>
      <div class="table-wrap" style="border:none;border-radius:0">
        <table>
          <thead><tr><th>عنوان</th><th>شناسه</th><th>وضعیت</th><th>ترتیب</th><th></th></tr></thead>
          <tbody id="modelRows">
            ${models.map(m => `
              <tr data-id="${m.id}">
                <td><strong>${esc(m.label)}</strong>${m.note ? `<br><small style="color:var(--text-muted)">${esc(m.note)}</small>` : ''}</td>
                <td class="mono" style="font-size:.78rem">${esc(m.model_id)}</td>
                <td><label class="switch"><input type="checkbox" data-act="toggle" ${m.enabled ? 'checked' : ''}> ${m.enabled ? 'فعال' : 'غیرفعال'}</label></td>
                <td>${faNum(m.sort_order)}</td>
                <td><button class="btn btn-sm btn-ghost" data-act="del" style="color:var(--danger)">حذف</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  $('#saveKey').onclick = async () => {
    try {
      await api.post('/api/admin/settings', { nvidia_api_key: $('#ak').value, nvidia_base_url: $('#bu').value.trim() });
      toast('ذخیره شد.', 'ok');
      refreshHealth();
    } catch (e) { toast(e.message, 'err'); }
  };

  $('#saveGen').onclick = async () => {
    try {
      await api.post('/api/admin/settings', {
        default_model: $('#dm').value, max_tokens: $('#mt').value,
        temperature: $('#tp').value, top_p: $('#pp').value
      });
      toast('پارامترها ذخیره شد.', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };

  $('#testKey').onclick = async e => {
    const out = $('#testOut');
    e.target.disabled = true;
    out.innerHTML = '<div class="alert alert-info"><span class="spinner"></span> در حال تماس با سرویس…</div>';
    try {
      const r = await api.post('/api/admin/test-key', { model: $('#dm').value });
      out.innerHTML = `<div class="alert alert-success">✓ اتصال سالم است — مدل <code>${esc(r.model)}</code> در ${faNum(r.latencyMs)} میلی‌ثانیه پاسخ داد: «${esc(r.reply)}»</div>`;
    } catch (err) {
      out.innerHTML = `<div class="alert alert-danger">✗ ${esc(err.message)}${err.data?.detail ? `<br><small class="mono">${esc(err.data.detail)}</small>` : ''}</div>`;
    } finally { e.target.disabled = false; }
  };

  $('#fetchRemote').onclick = async e => {
    e.target.disabled = true;
    try {
      const r = await api.get('/api/admin/models/remote');
      modal({
        title: `${faNum(r.models.length)} مدل روی حساب شما`,
        body: `<p class="hint" style="margin-bottom:.8rem">شناسه را کپی کنید و از دکمه «افزودن مدل» استفاده کنید.</p>
               <div class="mono" style="max-height:340px;overflow:auto;font-size:.78rem;line-height:2;
                    background:var(--bg-subtle);padding:.8rem;border-radius:8px">
                 ${r.models.map(m => esc(m)).join('<br>')}
               </div>`,
        actions: [{ label: 'بستن' }]
      });
    } catch (err) { toast(err.message, 'err'); }
    finally { e.target.disabled = false; }
  };

  $('#addModel').onclick = () => {
    modal({
      title: 'افزودن مدل',
      body: `
        <div class="field"><label for="nm-id">شناسه مدل</label>
          <input class="input mono" id="nm-id" placeholder="nvidia/llama-3.1-nemotron-70b-instruct"></div>
        <div class="field"><label for="nm-label">عنوان نمایشی</label>
          <input class="input" id="nm-label" placeholder="Llama 3.1 Nemotron 70B"></div>
        <div class="field"><label for="nm-note">توضیح کوتاه</label>
          <input class="input" id="nm-note" placeholder="مناسب تحلیل‌های عمیق"></div>`,
      actions: [
        { label: 'افزودن', className: 'btn-primary', onClick: async root => {
            try {
              await api.post('/api/admin/models', {
                model_id: root.querySelector('#nm-id').value.trim(),
                label: root.querySelector('#nm-label').value.trim(),
                note: root.querySelector('#nm-note').value.trim()
              });
              toast('مدل افزوده شد.', 'ok');
              loaded.delete('ai'); show('ai');
            } catch (e) { toast(e.message, 'err'); return 'keep'; }
          } },
        { label: 'انصراف' }
      ]
    });
  };

  $('#modelRows').onclick = async e => {
    const row = e.target.closest('tr');
    if (!row) return;
    const id = row.dataset.id;
    if (e.target.dataset.act === 'toggle') {
      try { await api.put(`/api/admin/models/${id}`, { enabled: e.target.checked }); toast('ذخیره شد.', 'ok'); }
      catch (err) { toast(err.message, 'err'); e.target.checked = !e.target.checked; }
    }
    if (e.target.dataset.act === 'del') {
      if (!await confirmDialog('حذف مدل', 'این مدل از فهرست انتخاب کاربران حذف می‌شود.', 'حذف')) return;
      try { await api.del(`/api/admin/models/${id}`); row.remove(); toast('حذف شد.', 'ok'); }
      catch (err) { toast(err.message, 'err'); }
    }
  };
};

/* ---------------- دستور تحلیل ---------------- */
loaders.prompts = async () => {
  const host = $('#p-prompts');
  host.innerHTML = '<div class="skeleton" style="height:8rem"></div>';
  const data = await api.get('/api/admin/prompts');
  let current = data.items.find(p => p.key === data.activeKey) || data.items[0];

  host.innerHTML = `
    <h2 class="sec-h">دستور تحلیل مدل</h2>
    <p class="sec-p">این متن به‌عنوان پیام سیستمی برای هر تحلیل فرستاده می‌شود و لحن، عمق و قالب خروجی را تعیین می‌کند.
      قالب بلوک‌ها (<span class="var-chip">@@key@@</span>) باید حفظ شود، وگرنه نتیجه در کارت‌ها نمی‌نشیند.</p>

    <div class="alert alert-warn">
      <strong>کلیدهای ضروری:</strong>
      <span class="var-chip">@@reframe@@</span><span class="var-chip">@@stakeholders@@</span><span class="var-chip">@@options@@</span>
      <span class="var-chip">@@school:virtue@@</span> … <span class="var-chip">@@school:nietzsche@@</span>
      <span class="var-chip">@@gate:dignity@@</span> … <span class="var-chip">@@gate:authenticity@@</span>
      <span class="var-chip">@@tensions@@</span><span class="var-chip">@@recommendation@@</span>
      <span class="var-chip">@@questions@@</span><span class="var-chip">@@blindspots@@</span>
    </div>

    <div class="split">
      <div class="card">
        <div class="card-head" style="padding:.85rem 1rem"><h3 style="font-size:.92rem">نسخه‌ها</h3>
          <button class="btn btn-sm" id="newPrompt">＋</button></div>
        <div class="card-body" style="padding:.7rem">
          <div class="plist" id="plist"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3 id="pTitle">—</h3>
          <div class="row" style="gap:.4rem">
            <button class="btn btn-sm" id="restoreDefault">بازگرداندن متن کارخانه</button>
            <button class="btn btn-sm" id="activatePrompt">فعال‌سازی</button>
            <button class="btn btn-sm btn-primary" id="savePrompt">ذخیره</button>
          </div>
        </div>
        <div class="card-body">
          <div class="field">
            <label for="pLabel">عنوان نسخه</label>
            <input class="input" id="pLabel">
          </div>
          <div class="field">
            <label for="pContent">متن دستور</label>
            <textarea class="textarea code-area" id="pContent"></textarea>
          </div>
          <button class="btn btn-sm btn-ghost" id="delPrompt" style="color:var(--danger)">حذف این نسخه</button>
        </div>
      </div>
    </div>`;

  const renderList = () => {
    $('#plist').innerHTML = data.items.map(p => `
      <button data-id="${p.id}" class="${p.id === current.id ? 'active' : ''}">
        ${esc(p.label)}
        <small>${p.key === data.activeKey ? '● فعال' : 'غیرفعال'} — ${relTime(p.updated_at)}</small>
      </button>`).join('');
  };

  const renderEditor = () => {
    $('#pTitle').innerHTML = `${esc(current.label)} ${current.key === data.activeKey ? '<span class="badge badge-success">فعال</span>' : ''}`;
    $('#pLabel').value = current.label;
    $('#pContent').value = current.content;
  };

  renderList(); renderEditor();

  $('#plist').onclick = e => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    current = data.items.find(p => p.id === +b.dataset.id);
    renderList(); renderEditor();
  };

  $('#savePrompt').onclick = async () => {
    try {
      await api.put(`/api/admin/prompts/${current.id}`, {
        label: $('#pLabel').value.trim(), content: $('#pContent').value
      });
      current.label = $('#pLabel').value.trim();
      current.content = $('#pContent').value;
      current.updated_at = new Date().toISOString();
      renderList(); renderEditor();
      toast('دستور ذخیره شد.', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };

  $('#activatePrompt').onclick = async () => {
    try {
      const r = await api.post(`/api/admin/prompts/${current.id}/activate`);
      data.activeKey = r.activeKey;
      renderList(); renderEditor();
      toast('این نسخه فعال شد.', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };

  $('#restoreDefault').onclick = async () => {
    if (!await confirmDialog('بازگرداندن متن کارخانه', 'متن فعلی ویرایشگر با نسخه پیش‌فرض جایگزین می‌شود. تا وقتی ذخیره نکنید تغییری ثبت نمی‌شود.', 'جایگزین کن')) return;
    $('#pContent').value = data.factoryDefault;
    toast('متن کارخانه بارگذاری شد — برای ثبت، ذخیره کنید.');
  };

  $('#newPrompt').onclick = () => {
    modal({
      title: 'نسخه تازه دستور',
      body: `<div class="field"><label for="np-key">کلید یکتا (انگلیسی)</label>
               <input class="input mono" id="np-key" placeholder="core-fa-v2"></div>
             <div class="field"><label for="np-label">عنوان</label>
               <input class="input" id="np-label" placeholder="نسخه آزمایشی"></div>
             <label class="switch"><input type="checkbox" id="np-copy" checked> شروع از روی نسخه فعلی</label>`,
      actions: [
        { label: 'ساختن', className: 'btn-primary', onClick: async root => {
            try {
              await api.post('/api/admin/prompts', {
                key: root.querySelector('#np-key').value.trim(),
                label: root.querySelector('#np-label').value.trim(),
                content: root.querySelector('#np-copy').checked ? $('#pContent').value : data.factoryDefault
              });
              toast('نسخه ساخته شد.', 'ok');
              loaded.delete('prompts'); show('prompts');
            } catch (e) { toast(e.message, 'err'); return 'keep'; }
          } },
        { label: 'انصراف' }
      ]
    });
  };

  $('#delPrompt').onclick = async () => {
    if (!await confirmDialog('حذف نسخه', `نسخه «${current.label}» حذف شود؟`, 'حذف')) return;
    try {
      await api.del(`/api/admin/prompts/${current.id}`);
      toast('حذف شد.', 'ok');
      loaded.delete('prompts'); show('prompts');
    } catch (e) { toast(e.message, 'err'); }
  };
};

/* ---------------- کاربران ---------------- */
loaders.users = async () => {
  const host = $('#p-users');
  host.innerHTML = `
    <h2 class="sec-h">کاربران</h2>
    <p class="sec-p">نقش، وضعیت و سهمیه روزانه هر کاربر را اینجا مدیریت کنید.</p>
    <div class="row" style="margin-bottom:1rem">
      <input class="input" id="uq" style="max-width:320px" type="search" placeholder="جست‌وجو در نام یا ایمیل…">
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>کاربر</th><th>نقش</th><th>وضعیت</th><th>سهمیه</th><th>تحلیل</th><th>آخرین ورود</th><th></th></tr></thead>
      <tbody id="uRows"></tbody></table></div>
    <div class="pager" id="uPager" style="display:flex;justify-content:center;gap:.4rem;margin-top:1rem"></div>`;

  let upage = 1, uq = '';

  async function loadUsers() {
    const p = new URLSearchParams({ page: upage });
    if (uq) p.set('q', uq);
    const d = await api.get('/api/admin/users?' + p);
    $('#uRows').innerHTML = d.items.map(u => `
      <tr data-id="${u.id}">
        <td><strong>${esc(u.name)}</strong><br><small class="mono" style="color:var(--text-muted)">${esc(u.email)}</small></td>
        <td>${u.role === 'admin' ? '<span class="badge badge-primary">مدیر</span>' : '<span class="badge">کاربر</span>'}</td>
        <td>${u.status === 'active' ? '<span class="badge badge-success">فعال</span>' : '<span class="badge badge-danger">مسدود</span>'}</td>
        <td>${faNum(u.daily_quota)}</td>
        <td>${faNum(u.analyses)}</td>
        <td style="font-size:.78rem;color:var(--text-muted)">${u.last_login_at ? relTime(u.last_login_at) : 'هرگز'}</td>
        <td><button class="btn btn-sm" data-act="edit">ویرایش</button></td>
      </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-muted)">کاربری یافت نشد</td></tr>';

    $('#uPager').innerHTML = d.pages > 1
      ? Array.from({ length: d.pages }, (_, i) =>
          `<button class="btn btn-sm ${i + 1 === d.page ? 'btn-primary' : ''}" data-page="${i + 1}">${faNum(i + 1)}</button>`).join('')
      : '';
  }

  let t;
  $('#uq').oninput = e => { clearTimeout(t); t = setTimeout(() => { uq = e.target.value.trim(); upage = 1; loadUsers(); }, 300); };
  $('#uPager').onclick = e => {
    const b = e.target.closest('button[data-page]');
    if (b) { upage = +b.dataset.page; loadUsers(); }
  };

  $('#uRows').onclick = async e => {
    const b = e.target.closest('button[data-act="edit"]');
    if (!b) return;
    const row = b.closest('tr');
    const id = row.dataset.id;
    const name = row.querySelector('strong').textContent;
    const isAdmin = row.children[1].textContent.includes('مدیر');
    const isActive = row.children[2].textContent.includes('فعال');
    const quota = row.children[3].textContent;

    modal({
      title: `ویرایش ${name}`,
      body: `
        <div class="field"><label for="eu-name">نام</label><input class="input" id="eu-name" value="${esc(name)}"></div>
        <div class="grid-2">
          <div class="field"><label for="eu-role">نقش</label>
            <select class="select" id="eu-role">
              <option value="user" ${!isAdmin ? 'selected' : ''}>کاربر عادی</option>
              <option value="admin" ${isAdmin ? 'selected' : ''}>مدیر سامانه</option>
            </select></div>
          <div class="field"><label for="eu-status">وضعیت</label>
            <select class="select" id="eu-status">
              <option value="active" ${isActive ? 'selected' : ''}>فعال</option>
              <option value="suspended" ${!isActive ? 'selected' : ''}>مسدود</option>
            </select></div>
        </div>
        <div class="field"><label for="eu-quota">سهمیه روزانه تحلیل</label>
          <input class="input" id="eu-quota" type="number" min="0" max="1000" value="${quota.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}"></div>
        <hr style="border:none;border-top:1px solid var(--border);margin:1.1rem 0">
        <div class="field"><label for="eu-pass">تعیین رمز تازه (اختیاری)</label>
          <input class="input" id="eu-pass" type="password" placeholder="خالی بگذارید تا تغییری نکند"></div>`,
      actions: [
        { label: 'ذخیره', className: 'btn-primary', onClick: async root => {
            try {
              await api.put(`/api/admin/users/${id}`, {
                name: root.querySelector('#eu-name').value.trim(),
                role: root.querySelector('#eu-role').value,
                status: root.querySelector('#eu-status').value,
                daily_quota: root.querySelector('#eu-quota').value
              });
              const pw = root.querySelector('#eu-pass').value;
              if (pw) await api.post(`/api/admin/users/${id}/reset-password`, { password: pw });
              toast('ذخیره شد.', 'ok');
              loadUsers();
            } catch (err) { toast(err.message, 'err'); return 'keep'; }
          } },
        { label: 'حذف کاربر', className: 'btn-danger', onClick: async () => {
            if (!await confirmDialog('حذف کاربر', `${name} و همه تحلیل‌هایش برای همیشه حذف می‌شوند.`, 'حذف کن')) return 'keep';
            try { await api.del(`/api/admin/users/${id}`); toast('حذف شد.', 'ok'); loadUsers(); }
            catch (err) { toast(err.message, 'err'); return 'keep'; }
          } },
        { label: 'انصراف' }
      ]
    });
  };

  loadUsers();
};

/* ---------------- تحلیل‌ها ---------------- */
loaders.analyses = async () => {
  const host = $('#p-analyses');
  host.innerHTML = `
    <h2 class="sec-h">تحلیل‌های ثبت‌شده</h2>
    <p class="sec-p">فهرست همه تحلیل‌های سامانه. متن تحلیل کاربران از اینجا قابل مشاهده نیست.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>عنوان</th><th>کاربر</th><th>مدل</th><th>وضعیت</th><th>زمان</th><th>تاریخ</th></tr></thead>
      <tbody id="aRows"></tbody></table></div>
    <div class="pager" id="aPager" style="display:flex;justify-content:center;gap:.4rem;margin-top:1rem"></div>`;

  let apage = 1;
  async function loadA() {
    const d = await api.get('/api/admin/analyses?page=' + apage);
    $('#aRows').innerHTML = d.items.map(a => `
      <tr>
        <td style="max-width:280px">${esc(a.title)}</td>
        <td><small class="mono" style="color:var(--text-muted)">${esc(a.email)}</small></td>
        <td class="mono" style="font-size:.75rem">${esc(a.model)}</td>
        <td>${a.status === 'done' ? '<span class="badge badge-success">کامل</span>'
             : a.status === 'error' ? '<span class="badge badge-danger">خطا</span>'
             : '<span class="badge badge-warn">ناتمام</span>'}</td>
        <td>${duration(a.duration_ms)}</td>
        <td style="font-size:.78rem;color:var(--text-muted)">${relTime(a.created_at)}</td>
      </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">هنوز تحلیلی ثبت نشده</td></tr>';

    $('#aPager').innerHTML = d.pages > 1
      ? Array.from({ length: Math.min(d.pages, 12) }, (_, i) =>
          `<button class="btn btn-sm ${i + 1 === d.page ? 'btn-primary' : ''}" data-page="${i + 1}">${faNum(i + 1)}</button>`).join('')
      : '';
  }
  $('#aPager').onclick = e => {
    const b = e.target.closest('button[data-page]');
    if (b) { apage = +b.dataset.page; loadA(); }
  };
  loadA();
};

      });

/* ---------------- سلامت سرویس ---------------- */
async function refreshHealth() {
  try {
    const d = await api.get('/api/admin/overview');
    const b = $('#healthBadge');
    if (d.apiKeySet) { b.className = 'badge badge-success'; b.textContent = '● کلید API ثبت شده'; }
    else { b.className = 'badge badge-danger'; b.textContent = '● کلید API ثبت نشده'; }
  } catch { $('#healthBadge').textContent = '—'; }
}
refreshHealth();

show(location.hash.slice(1) || 'overview');
