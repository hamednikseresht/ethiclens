<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحلیل — اتیکا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/result.css">
<link rel="stylesheet" href="/css/motion.css">
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div id="headHost"></div>
  <div id="resultHost"></div>
</main>

<script type="module">
import { $, api, boot, esc, faNum, faDate, duration, toast, confirmDialog } from '/js/core.js';
import { buildSkeleton, applySections, verdictChips, gateSummary } from '/js/result.js';
import { exportBar, wireExport } from '/js/export.js';
import { initMotion, revealOnScroll } from '/js/motion.js';

if (!await boot()) throw new Error('unauthenticated');

const id = new URLSearchParams(location.search).get('id');
if (!id) location.replace('/history');

let a;
try {
  a = await api.get(`/api/history/${id}`);
} catch (e) {
  $('#headHost').innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>
    <a class="btn" href="/history">بازگشت به تاریخچه</a>`;
  throw e;
}

const sections = a.sections || {};
const ctx = a.context || {};
const ctxBits = [ctx.domain && `حوزه: ${ctx.domain}`, ctx.urgency && `فوریت: ${ctx.urgency}`].filter(Boolean);

const gateStrip = a.status === 'done'
  ? `<div class="gate-strip">${gateSummary(sections).map(g =>
      `<span class="gate-pill" data-state="${g.state}"><b>${g.n}</b> ${esc(g.title)}: ${esc(g.label)}</span>`).join('')}</div>`
  : '';

$('#headHost').innerHTML = `
  <div class="result-head">
    <div class="row-between" style="margin-bottom:.6rem">
      <a href="/history" class="btn btn-sm btn-ghost no-print">→ بازگشت به تاریخچه</a>
      <div id="actionBar">
        ${exportBar({
          analysisId: a.id,
          extra: `<button class="btn btn-sm" id="favBtn">${a.is_favorite ? '⭐ نشان‌شده' : '☆ نشان کردن'}</button>`
        })}
      </div>
    </div>
    <h1>${esc(a.title)}</h1>
    <div class="meta-row">
      <span class="badge">${faDate(a.created_at)}</span>
      <span class="badge">${esc(a.model)}</span>
      <span class="badge">${duration(a.duration_ms)}</span>
      ${ctxBits.map(b => `<span class="badge">${esc(b)}</span>`).join('')}
      ${a.status === 'done' ? verdictChips(sections) : ''}
    </div>
    ${gateStrip}
    <div class="result-dilemma">${esc(a.dilemma)}</div>
    <div class="row no-print" style="margin-top:.8rem;justify-content:flex-start">
      <button class="btn btn-sm btn-ghost" id="delBtn" style="color:var(--danger)">حذف این تحلیل</button>
    </div>
  </div>`;

if (a.status === 'error') {
  $('#resultHost').innerHTML = `
    <div class="alert alert-danger">این تحلیل کامل نشد: ${esc(a.error || 'خطای نامشخص')}</div>
    <a class="btn btn-primary" href="/app">تحلیل تازه</a>`;
} else if (a.status === 'pending') {
  $('#resultHost').innerHTML = `
    <div class="alert alert-warn">این تحلیل ناتمام مانده است — احتمالاً صفحه پیش از پایان بسته شده.</div>
    <a class="btn btn-primary" href="/app">دوباره تحلیل کنید</a>`;
} else {
  buildSkeleton($('#resultHost'));
  applySections(sections, { streaming: false });

  // فاز پنجم: ثبت تصمیم واقعی و بازنگری بعدی
  $('#resultHost').insertAdjacentHTML('beforeend', `
    <section class="res-block reflect" id="reflectBlock">
      <h3 class="res-h"><span class="res-ic">📔</span> دفترچه بازنگری</h3>
      <p class="res-sub">
        تحلیل، نیمه اول کار است. اینجا ثبت کنید واقعاً چه تصمیمی گرفتید و بعداً چه شد —
        این تنها بخشی از فرایند است که هیچ مدلی نمی‌تواند جایتان انجام دهد.
      </p>
      <div id="reflectBody"></div>
    </section>`);

  $('#resultHost').insertAdjacentHTML('beforeend',
    '<div class="disclaimer">این تحلیل توسط یک مدل زبانی تولید شده و می‌تواند خطا داشته باشد. تصمیم نهایی و مسئولیت آن با شماست. اتیکا جایگزین مشاوره حقوقی، پزشکی یا روان‌شناختی نیست.</div>');

  renderReflection(a);

  wireExport($('#actionBar'), {
    analysisId: a.id,
    sections,
    meta: { analysisId: a.id, title: a.title, createdAt: a.created_at, model: a.model }
  });
}

revealOnScroll('.res-block, .stage');
initMotion({ reveal: null });

$('#favBtn')?.addEventListener('click', async e => {
  try {
    const r = await api.post(`/api/history/${a.id}/favorite`);
    e.currentTarget.textContent = r.isFavorite ? '⭐ نشان‌شده' : '☆ نشان کردن';
  } catch (err) { toast(err.message, 'err'); }
});

/* ---------------- دفترچه بازنگری ---------------- */
function renderReflection(rec) {
  const host = $('#reflectBody');
  if (!host) return;

  if (rec.reflected_at && !host.dataset.editing) {
    host.innerHTML = `
      <div class="reflect-saved">
        <div class="reflect-meta">ثبت‌شده در ${faDate(rec.reflected_at)}</div>
        ${rec.decision ? `<div class="reflect-decision"><span>تصمیمی که گرفتم</span><strong>${esc(rec.decision)}</strong></div>` : ''}
        ${rec.reflection ? `<div class="prose reflect-text">${esc(rec.reflection).replace(/\n/g, '<br>')}</div>` : ''}
        <button class="btn btn-sm no-print" id="editReflect">ویرایش</button>
      </div>`;
    $('#editReflect').onclick = () => { host.dataset.editing = '1'; renderReflection(rec); };
    return;
  }

  host.innerHTML = `
    <div class="no-print">
      <div class="field">
        <label for="rf-decision">در نهایت چه تصمیمی گرفتید؟</label>
        <input class="input" id="rf-decision" maxlength="300"
               value="${esc(rec.decision || '')}" placeholder="مثلاً: گزینه د — توقف فروش تا اصلاح الگوریتم">
      </div>
      <div class="field">
        <label for="rf-text">چه شد و چه آموختید؟</label>
        <textarea class="textarea" id="rf-text" rows="4" maxlength="4000"
          placeholder="نتیجه واقعی چه بود؟ چه چیزی را درست پیش‌بینی کرده بودید و چه چیزی غافلگیرتان کرد؟ اگر دوباره در همین موقعیت بودید چه می‌کردید؟">${esc(rec.reflection || '')}</textarea>
        <span class="hint">هر وقت خواستید برگردید و کامل‌ترش کنید.</span>
      </div>
      <div class="row">
        <button class="btn btn-primary btn-sm" id="saveReflect">ذخیره بازنگری</button>
        ${rec.reflected_at ? '<button class="btn btn-sm btn-ghost" id="cancelReflect">انصراف</button>' : ''}
      </div>
    </div>`;

  $('#saveReflect').onclick = async e => {
    e.target.disabled = true;
    try {
      const r = await api.post(`/api/history/${rec.id}/reflection`, {
        decision: $('#rf-decision').value,
        reflection: $('#rf-text').value
      });
      Object.assign(rec, {
        decision: r.decision ?? null,
        reflection: r.reflection ?? null,
        reflected_at: r.reflected_at ?? null
      });
      delete host.dataset.editing;
      renderReflection(rec);
      toast(r.cleared ? 'بازنگری پاک شد.' : 'بازنگری ذخیره شد.', 'ok');
    } catch (err) { toast(err.message, 'err'); e.target.disabled = false; }
  };

  $('#cancelReflect')?.addEventListener('click', () => {
    delete host.dataset.editing;
    renderReflection(rec);
  });
}

$('#delBtn')?.addEventListener('click', async () => {
  if (!await confirmDialog('حذف تحلیل', 'این تحلیل برای همیشه حذف می‌شود. مطمئنید؟', 'حذف کن')) return;
  try { await api.del(`/api/history/${a.id}`); location.replace('/history'); }
  catch (err) { toast(err.message, 'err'); }
});
</script>
</body>
</html>
